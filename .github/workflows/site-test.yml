name: Site testi (canlı)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tests/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Araçları kur
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Gerçek tarayıcı testi (telefon ekranı)
        run: node tarayici.mjs
      - name: Lighthouse (mobil ve masaüstü)
        run: |
          CH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          for u in "https://kulistr.com/" "https://kulistr.com/gizlilik.html"; do
            n=$(echo "$u" | sed 's#https://kulistr.com/##; s#\.html##; s#^$#anasayfa#')
            CHROME_PATH=$CH npx lighthouse "$u" --quiet --chrome-flags="--headless=new --no-sandbox" --output=json --output-path="lh-$n-mobil.json" || true
          done
          CHROME_PATH=$CH npx lighthouse "https://kulistr.com/" --quiet --preset=desktop --chrome-flags="--headless=new --no-sandbox" --output=json --output-path="lh-anasayfa-masaustu.json" || true
          node lh-ozet.mjs
      - name: Kırık link taraması
        run: npx linkinator https://kulistr.com --recurse --skip "play.google.com|groups.google.com|firebasestorage|googleapis|gstatic|google-analytics|googletagmanager|wa.me|t.me|x.com|twitter.com|instagram.com|facebook.com|mailto:" --format json > linkler.json || true; node -e "const j=require('./linkler.json');const b=j.links.filter(l=>l.state==='BROKEN');console.log('Taranan:',j.links.length,'Kırık:',b.length);b.forEach(l=>console.log('KIRIK',l.status,l.url,'<-',l.parent))"
      - name: HTML ve SSL kontrolü
        run: |
          echo "--- SSL sertifikası ---"; echo | openssl s_client -servername kulistr.com -connect kulistr.com:443 2>/dev/null | openssl x509 -noout -issuer -enddate
          echo "--- www yönlendirmesi ---"; curl -sI http://kulistr.com | head -3; curl -sI https://www.kulistr.com | head -3
          echo "--- sıkıştırma ---"; curl -s -H 'Accept-Encoding: gzip, br' -o /dev/null -w 'index.html aktarılan: %{size_download} bayt\n' --compressed https://kulistr.com/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-test-sonuclari
          path: |
            tests/site/*.json
            tests/site/*.png
