name: Teşhis
# Sunucudaki durumu okur, hiçbir şeyi değiştirmez. Kişisel bilgi yazdırmaz.
on:
  workflow_dispatch:
    inputs:
      konu:
        description: "bildirim"
        default: bildirim
permissions: { contents: read, id-token: write }
jobs:
  teshis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/165708007413/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@kulis-1647d.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: npm i --no-save --no-audit --no-fund firebase-admin@13
      - name: Firestore durumu
        run: node build/teshis/${{ inputs.konu }}.mjs
      - name: Son 12 saatin bildirim kayıtları
        continue-on-error: true
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND (resource.labels.service_name="bildirimtelefona" OR resource.labels.service_name="duyurugonder") AND timestamp>="'$(date -u -d '-12 hours' +%Y-%m-%dT%H:%M:%SZ)'"' \
            --project kulis-1647d --limit 80 --format='value(timestamp,resource.labels.service_name,severity,jsonPayload.message,jsonPayload.tag,jsonPayload.sent,jsonPayload.failed,jsonPayload.kisi,textPayload)' | sed -E 's/[A-Za-z0-9]{28}/<uid>/g'
