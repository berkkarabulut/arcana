name: Font önizleme
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: tests/site
        env:
          YENI_FONT: "https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,400;1,500&family=Figtree:wght@400;500;600;700;800&display=swap"
        run: |
          npm i --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium
          node font-onizleme.mjs
      - run: |
          mkdir /tmp/o && cp tests/site/font-*.png /tmp/o/ && cd /tmp/o && git init -q && git checkout -q -b onizleme
          git -c user.name=bot -c user.email=bot@x add . && git -c user.name=bot -c user.email=bot@x commit -qm onizleme
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" onizleme
