name: Açılış dönemi
# Açılış dönemi anahtarı (config/genel.acilis). Aynısı yönetici panelinde Duyuru sekmesinin üstünde de var.
on:
  workflow_dispatch:
    inputs:
      islem:
        description: "durum / ac / kapat"
        required: true
        default: durum
        type: choice
        options: [durum, ac, kapat]
permissions: { contents: read, id-token: write }
jobs:
  acilis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/165708007413/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@kulis-1647d.iam.gserviceaccount.com
      - run: npm i --no-save --no-audit --no-fund firebase-admin@13
      - run: node build/teshis/acilis.mjs ${{ inputs.islem }}
