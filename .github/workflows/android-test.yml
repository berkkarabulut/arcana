name: Android açılış testi
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-test.yml"]
jobs:
  ac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.kulistr.app/com.google.androidbrowserhelper.trusted.LauncherActivity
            sleep 25
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | head -3
            adb logcat -d -b crash > /tmp/crash.txt || true
            echo "===== CRASH ====="; cat /tmp/crash.txt | head -80
            echo "===== RUNTIME ====="; adb logcat -d | grep -E "AndroidRuntime|FATAL|kulistr|TWA|LauncherActivity" | head -80
