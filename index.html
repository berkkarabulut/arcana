<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İtiraf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,500&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: tek kolon gece akışı. İtiraflar el yazısı not gibi serif italik; geri kalan her şey sessiz sans. */
:root{
  --murekkep:#14101A;   /* zemin */
  --yuzey:#1F1926;      /* kart */
  --yuzey2:#2A2233;     /* yükseltilmiş */
  --nar:#E8505B;        /* vurgu: itiraf et, kalp */
  --kagit:#F4ECE4;      /* metin */
  --soluk:#A497AE;      /* ikincil */
  --cizgi:rgba(244,236,228,.09);
  --altin:#E9B96E;      /* premium */
  --display:"Newsreader",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--murekkep);color:var(--kagit);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--nar);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance}
.glyph{font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",var(--body);font-variant-emoji:text}
.muted{color:var(--soluk)}
.shell{max-width:480px;margin:0 auto;padding:0 16px 120px;min-height:100%}

/* üst */
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;padding:16px 0 10px;background:linear-gradient(var(--murekkep) 70%,transparent)}
.logo{font-family:var(--display);font-style:italic;font-size:30px;line-height:1;letter-spacing:-.02em}
.logo b{font-weight:400;color:var(--nar)}
.prem-pill{height:32px;padding:0 12px;border-radius:99px;border:1px solid rgba(233,185,110,.4);color:var(--altin);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}

/* avatar */
.av{flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#14101A;position:relative}
.av .z{position:absolute;right:-3px;bottom:-3px;width:46%;height:46%;border-radius:50%;background:var(--murekkep);color:var(--kagit);display:grid;place-items:center;font-size:.62em;border:1.5px solid var(--murekkep)}
.who{display:flex;align-items:center;gap:10px;text-align:left}
.who b{font-weight:700;font-size:14px}
.who small{display:block;color:var(--soluk);font-size:12.5px;line-height:1.3}

/* kategori */
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px 12px}
.cats::-webkit-scrollbar{display:none}
.c{flex:0 0 auto;height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--cizgi);font-size:13.5px;font-weight:600;color:var(--soluk);display:inline-flex;align-items:center;gap:6px}
.c[aria-pressed="true"]{background:var(--kagit);color:var(--murekkep);border-color:var(--kagit)}
.c.lock{opacity:.75}

/* itiraf kartı */
.it{background:var(--yuzey);border-radius:22px;padding:16px 16px 10px;margin-bottom:10px}
.it-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.it-cat{font-size:12px;color:var(--soluk);font-weight:600;white-space:nowrap}
.it blockquote{font-family:var(--display);font-style:italic;font-size:21px;line-height:1.38;margin:14px 2px 12px;letter-spacing:-.005em;cursor:pointer}
.it blockquote.long{font-size:18.5px}
.reacts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.r{height:32px;padding:0 11px;border-radius:99px;background:var(--yuzey2);font-size:13px;font-weight:600;color:var(--soluk);display:inline-flex;align-items:center;gap:6px}
.r[aria-pressed="true"]{background:rgba(232,80,91,.16);color:var(--kagit);box-shadow:inset 0 0 0 1px rgba(232,80,91,.5)}
.r .n{font-variant-numeric:tabular-nums}
.it-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;border-top:1px solid var(--cizgi);padding-top:6px}
.lnk{height:36px;padding:0 8px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--soluk);display:inline-flex;align-items:center;gap:7px}
.lnk:hover{color:var(--kagit);background:var(--cizgi)}
.lnk.dm{color:var(--nar)}
.lnk svg{width:17px;height:17px}

/* yorumlar */
.cm{padding:12px 0;border-top:1px solid var(--cizgi)}
.cm p{margin:6px 0 0 46px;font-size:15px;line-height:1.5}
.cm .who{width:100%}
.cm .when{margin-left:auto;font-size:12px;color:var(--soluk)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,6,12,.7);display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--murekkep);border-radius:26px 26px 0 0;border:1px solid var(--cizgi);border-bottom:0;padding:10px 18px 24px;animation:up .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--cizgi);margin:0 auto 14px}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:28px;line-height:1.1}

/* yazma */
.box{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:18px;padding:4px;display:flex;align-items:flex-end;gap:4px}
.box textarea{flex:1;background:none;border:0;color:var(--kagit);font:inherit;font-size:15px;padding:11px 12px;resize:none;outline:none;min-height:44px;max-height:150px}
.box textarea::placeholder{color:var(--soluk)}
.box.big textarea{font-family:var(--display);font-style:italic;font-size:21px;line-height:1.4;min-height:150px}
.go{flex:0 0 auto;height:40px;padding:0 16px;border-radius:14px;background:var(--nar);color:#fff;font-weight:700;font-size:14px;margin:2px}
.go:disabled{opacity:.35;cursor:default}
.btn{height:48px;padding:0 20px;border-radius:15px;background:var(--nar);color:#fff;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.wide{width:100%}
.btn.line{background:none;border:1px solid var(--cizgi);color:var(--kagit)}
.btn.gold{background:var(--altin);color:#21170A}
.btn:disabled{opacity:.35;cursor:default}
.hint{font-size:12.5px;color:var(--soluk);margin-top:8px}
.warn{background:rgba(232,80,91,.12);color:#ffc9cd;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:8px}

/* profil */
.pro-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 0 16px}
.pro-head h2{font-size:32px;margin-top:12px;line-height:1}
.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
.bd{height:30px;padding:0 11px;border-radius:99px;background:var(--yuzey2);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.bd .glyph{color:var(--nar)}
.bio{font-family:var(--display);font-style:italic;font-size:18px;line-height:1.4;color:var(--kagit);margin-top:14px;max-width:34ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--cizgi);border-bottom:1px solid var(--cizgi);margin:4px 0 14px}
.stats div{padding:12px 0;text-align:center}
.stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--soluk)}
.uyum{display:flex;align-items:center;gap:14px;background:var(--yuzey);border-radius:18px;padding:14px;margin-bottom:14px}
.ring{width:58px;height:58px;flex:0 0 auto}
.uyum b{font-size:15px}
.uyum p{font-size:13px;color:var(--soluk);line-height:1.4;margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--cizgi);margin-bottom:4px}
.tabs button{height:42px;padding:0 12px;font-weight:700;font-size:14px;color:var(--soluk);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--kagit);border-color:var(--nar)}
.mini{padding:12px 0;border-bottom:1px solid var(--cizgi)}
.mini q{font-family:var(--display);font-style:italic;font-size:17px;line-height:1.4;quotes:none;display:block}
.mini .on{font-size:12.5px;color:var(--soluk);margin-top:4px}
.pro-acts{display:flex;gap:8px;position:sticky;bottom:-24px;background:linear-gradient(transparent,var(--murekkep) 30%);padding:18px 0 4px;margin-top:8px}

/* mesajlar */
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--cizgi);width:100%;text-align:left}
.row .t{flex:1;min-width:0}
.row .t b{font-weight:700}
.row .t div{font-size:13.5px;color:var(--soluk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t div.blur{filter:blur(4px);user-select:none}
.row .meta{text-align:right;font-size:12px;color:var(--soluk)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--nar);margin-top:4px}
.h2s{font-family:var(--display);font-size:30px;margin:6px 0 8px}
.req{display:flex;gap:10px;align-items:center;background:var(--yuzey);border-radius:18px;padding:12px;margin-bottom:8px}
.req .t{flex:1;min-width:0}
.req .t q{font-family:var(--display);font-style:italic;font-size:14.5px;color:var(--soluk);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;quotes:none}
.sbtn{height:34px;padding:0 12px;border-radius:11px;font-size:13px;font-weight:700}
.sbtn.ok{background:var(--nar);color:#fff}
.sbtn.no{border:1px solid var(--cizgi);color:var(--soluk)}

/* sohbet ekranı */
.chat{position:fixed;inset:0;z-index:45;background:var(--murekkep);display:none;flex-direction:column}
.chat.open{display:flex}
.chat-in{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%}
.chat-h{display:flex;align-items:center;gap:10px;padding:12px 12px;border-bottom:1px solid var(--cizgi)}
.back{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.back:hover{background:var(--cizgi)}
.chat-h .who{flex:1}
.meter{font-size:12px;color:var(--soluk);text-align:right;line-height:1.25}
.meter b{color:var(--kagit);font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--cizgi);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--nar);transition:width .3s}
.msgs{flex:1;overflow:auto;padding:14px 14px 10px;display:flex;flex-direction:column;gap:6px}
.origin{align-self:center;max-width:88%;text-align:center;margin:4px 0 12px}
.origin small{font-size:12px;color:var(--soluk)}
.origin q{display:block;font-family:var(--display);font-style:italic;font-size:16px;line-height:1.4;margin-top:4px;quotes:none}
.m{max-width:78%;padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.4;word-wrap:break-word}
.m.me{align-self:flex-end;background:var(--nar);color:#fff;border-bottom-right-radius:6px}
.m.them{align-self:flex-start;background:var(--yuzey2);border-bottom-left-radius:6px}
.m.locked{filter:blur(5px);user-select:none;pointer-events:none}
.sys{align-self:center;font-size:12.5px;color:var(--soluk);margin:6px 0}
.wall{margin:8px 0 4px;align-self:stretch;background:linear-gradient(160deg,#2B2016,#1F1926);border:1px solid rgba(233,185,110,.35);border-radius:20px;padding:16px;text-align:center}
.wall h3{font-size:22px;line-height:1.2;margin-bottom:6px}
.wall p{font-size:13.5px;color:var(--soluk);margin-bottom:12px}
.composer{padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--cizgi)}
.hb,.tb{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--soluk);flex:0 0 auto}
.hb:hover,.tb:hover{background:var(--cizgi);color:var(--kagit)}
.hb svg,.tb svg{width:21px;height:21px}
.tb{width:38px;height:40px;margin:2px 0}
.lk{position:absolute;right:3px;bottom:4px;width:15px;height:15px;border-radius:50%;background:var(--altin);color:#21170A;display:grid;place-items:center}
.lk svg{width:9px;height:9px}
.m.media{padding:4px;background:none}
.m.media img,.m.media video{display:block;max-width:230px;max-height:300px;border-radius:15px}
.voice{display:flex;align-items:center;gap:10px;min-width:180px}
.voice .pl{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:0 0 auto}
.wave{display:flex;align-items:center;gap:2px;flex:1;height:24px}
.wave i{width:3px;border-radius:2px;background:currentColor;opacity:.7}
.callmsg{align-self:center;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--soluk);background:var(--yuzey);padding:7px 12px;border-radius:99px;margin:4px 0}
.callmsg svg{width:15px;height:15px}
.rec{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 6px}
.rec .big{width:84px;height:84px;border-radius:50%;background:var(--nar);display:grid;place-items:center;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,80,91,.5)}100%{box-shadow:0 0 0 22px rgba(232,80,91,0)}}
.rec .tm{font-size:28px;font-variant-numeric:tabular-nums;font-weight:700}
.callscr{position:fixed;inset:0;z-index:58;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:60px 20px calc(36px + env(safe-area-inset-bottom));color:#fff;text-align:center}
.callscr.open{display:flex}
.callscr h2{font-size:34px;margin-top:18px}
.callscr .st{font-size:15px;opacity:.8;margin-top:6px;font-variant-numeric:tabular-nums}
.callscr .self{position:absolute;right:18px;top:18px;width:96px;height:132px;border-radius:16px;background:#2A2233;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;font-size:12px;color:var(--soluk)}
.cbtns{display:flex;gap:22px}
.cb{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
.cb[aria-pressed="true"]{background:#fff;color:#14101A}
.cb.end{background:#E5484D}
.cb svg{width:26px;height:26px}
.cnote{font-size:12px;opacity:.6;margin-top:14px}
.typing{display:inline-flex;gap:4px;padding:12px 14px;background:var(--yuzey2);border-radius:18px;align-self:flex-start}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--soluk);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}

/* premium */
.plans{display:grid;gap:8px;margin:14px 0}
.plan{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:16px;border:1px solid var(--cizgi);text-align:left;width:100%}
.plan[aria-pressed="true"]{border-color:var(--altin);background:rgba(233,185,110,.08)}
.plan b{font-size:15px}.plan small{display:block;font-size:12.5px;color:var(--soluk)}
.plan .p{font-weight:800;font-variant-numeric:tabular-nums}
.perks{display:grid;gap:8px;margin-top:12px}
.perks div{display:flex;gap:10px;font-size:14.5px}
.perks svg{flex:0 0 auto;color:var(--altin);margin-top:2px}

/* alt menü */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.nav-in{pointer-events:auto;width:100%;max-width:460px;height:66px;border-radius:22px;background:rgba(31,25,38,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--cizgi);display:grid;grid-template-columns:1fr 1fr 96px 1fr 1fr;align-items:center}
.nb{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--soluk);position:relative}
.nb svg{width:22px;height:22px}
.nb[aria-current="page"]{color:var(--kagit)}
.nb .pip{position:absolute;top:7px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--nar);color:#fff;font-size:10.5px;display:grid;place-items:center}
.confess{height:50px;margin:0 4px;border-radius:16px;background:var(--nar);color:#fff;font-weight:800;font-size:14px;line-height:1.1;box-shadow:0 8px 22px rgba(232,80,91,.35)}

.toast{position:fixed;left:50%;bottom:96px;z-index:70;pointer-events:none;transform:translate(-50%,12px);opacity:0;transition:.25s;background:var(--kagit);color:var(--murekkep);padding:11px 16px;border-radius:14px;font-size:13.5px;font-weight:700;max-width:88%;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{color:var(--soluk);padding:20px 4px;font-size:14px;line-height:1.55}

/* kayıt */
.onb{position:fixed;inset:0;z-index:60;background:var(--murekkep);overflow:auto}
.onb-in{max-width:480px;margin:0 auto;min-height:100%;padding:18px 22px 26px;display:flex;flex-direction:column}
.steps{display:flex;gap:6px;margin:6px 0 30px}
.steps i{flex:1;height:3px;border-radius:3px;background:var(--cizgi)}
.steps i.on{background:var(--nar)}
.ob-back{height:34px;color:var(--soluk);font-size:14px;display:inline-flex;align-items:center;gap:4px;margin-left:-4px;visibility:hidden}
.ob-back.show{visibility:visible}
.step{flex:1}
.step h1{font-size:40px;line-height:1.04;letter-spacing:-.015em;margin-bottom:12px}
.step .lead{color:var(--soluk);font-size:15.5px;max-width:36ch}
.nick{display:flex;align-items:center;gap:10px;margin-top:26px;border-bottom:1px solid var(--cizgi);padding-bottom:6px}
.nick input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--kagit);font-family:var(--display);font-style:italic;font-size:32px}
.nick input::placeholder{color:rgba(164,151,174,.5)}
.dice{height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--cizgi);font-size:13px;font-weight:700;color:var(--soluk);display:inline-flex;align-items:center;gap:6px;flex:0 0 auto}
.swatches{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid transparent}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--murekkep),0 0 0 4px var(--kagit)}
.wheels{position:relative;display:grid;gap:8px;margin-top:28px;height:220px}
.wheels::before{content:"";position:absolute;left:0;right:0;top:90px;height:40px;border-radius:10px;background:var(--yuzey);pointer-events:none}
.wheel{position:relative;height:220px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);overscroll-behavior:contain}
.wheel::-webkit-scrollbar{display:none}
.wheel .pad{height:90px}
.wheel button{display:block;width:100%;height:40px;scroll-snap-align:center;font-size:19px;color:var(--soluk);font-variant-numeric:tabular-nums}
.wheel button.sel{color:var(--kagit);font-weight:700}
.wlab{display:grid;gap:8px;text-align:center;font-size:12px;color:var(--soluk);margin-top:8px}
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.choice button{height:46px;border-radius:14px;border:1px solid var(--cizgi);font-weight:700;font-size:14px;color:var(--soluk)}
.choice button[aria-pressed="true"]{border-color:var(--nar);color:var(--kagit);background:rgba(232,80,91,.1)}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--soluk);margin-top:22px}
.sign-big{display:flex;align-items:center;gap:14px;margin-top:22px;background:var(--yuzey);border-radius:18px;padding:14px}
.sign-big .g{width:54px;height:54px;border-radius:16px;background:var(--yuzey2);display:grid;place-items:center;font-size:28px;color:var(--nar)}
.rules{display:grid;gap:10px;margin-top:22px}
.rules div{display:flex;gap:12px;font-size:14.5px;line-height:1.45}
.rules svg{flex:0 0 auto;margin-top:2px;color:var(--nar)}

// burç uyumu: element bazlı
function uyum(a,b){const ea=Z[a].e,eb=Z[b].e;let base=a===b?78:ea===eb?88:((ea===0&&eb===2)||(ea===2&&eb===0)||(ea===1&&eb===3)||(ea===3&&eb===1))?82:((ea+eb)%2===1&&Math.abs(ea-eb)!==2)?58:64;
  return Math.min(97,base+((a.length*7+b.length*3)%9))}
function uyumText(a,b,p){const ea=EL[Z[a].e],eb=EL[Z[b].e];
  if(a===b)return `İkiniz de ${Z[a].n}. Birbirinizi çok iyi anlarsınız ama aynı inatla da karşılaşırsınız.`;
  if(Z[a].e===Z[b].e)return `İkiniz de ${ea} grubundasınız. Aynı dili konuşursunuz, sohbet kendiliğinden akar.`;
  return p>=80?`${ea} ile ${eb} birbirini besler. Sohbetiniz hızlı ısınır.`:`${ea} ile ${eb} farklı tempolarda gider. İlk mesajlar biraz yoklama olur, sonra açılır.`}
function ringSVG(p){const r=24,c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 58 58"><circle cx="29" cy="29" r="${r}" fill="none" stroke="var(--yuzey2)" stroke-width="5"/><circle cx="29" cy="29" r="${r}" fill="none" stroke="var(--nar)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 29 29)"/><text x="29" y="30" text-anchor="middle" dominant-baseline="middle" fill="var(--kagit)" font-size="14" font-weight="800" font-family="Figtree">%${p}</text></svg>`}

// iletişim bilgisi filtresi
function contactBlock(t){
  const low=t.toLocaleLowerCase("tr");
  const digits=low.replace(/[^0-9]/g,"");
  if(/(\+?90|0)?\s*5\d{2}/.test(low.replace(/[\s.\-()]/g,""))&&digits.length>=9)return "telefon numarası";
  if(digits.length>=10)return "telefon numarası";
  const yazili=["sıfır","beş","bes","dokuz","sifir"];if(yazili.filter(w=>low.includes(w)).length>=3)return "yazıyla telefon numarası";
  const flat=low.replace(/[^a-zçğıöşü0-9]/g,"");
  const kw=[["instagram","Instagram"],["insta","Instagram"],["ınsta","Instagram"],["snapchat","Snapchat"],["snap","Snapchat"],["telegram","Telegram"],["whatsapp","WhatsApp"],["watsap","WhatsApp"],["vatsap","WhatsApp"],["wpden","WhatsApp"],["discord","Discord"],["tiktok","TikTok"],["twitter","X"],["gmail","e-posta"],["hotmail","e-posta"]];
  for(const[w,n]of kw)if(flat.includes(w))return n+" adresi";
  if(/@[a-z0-9_.]{3,}/i.test(t))return "kullanıcı adı";
  if(/\b[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}\b/i.test(t))return "e-posta";
  return null;
}

/* ============ SOHBET ============ */
let openIdx=-1;
function isLockedIdx(c,i){return !state.premium&&i>=FREE_LIMIT}
function openChat(i){openIdx=i;state.chats[i].unread=false;closeSheet();$("#chat").classList.add("open");drawChat();render()}
function closeChat(){openIdx=-1;$("#chat").classList.remove("open");render()}
function drawChat(){
  const c=state.chats[openIdx]; if(!c)return; const u=U[c.u];
  const used=c.msgs.length, left=Math.max(0,FREE_LIMIT-used), full=!state.premium&&used>=FREE_LIMIT;
  const hidden=c.msgs.filter((m,i)=>!m.me&&isLockedIdx(c,i)).length;
  $("#chatIn").innerHTML=`<div class="chat-h"><button class="back" id="cBack" aria-label="Geri">${IC.back}</button>${who(c.u,c.status==="wait"?"istek bekliyor":"çevrimiçi")}
    <button class="hb" data-media="call" aria-label="Sesli ara">${IC.phone}${lockBadge()}</button><button class="hb" data-media="video" aria-label="Görüntülü ara">${IC.video}${lockBadge()}</button></div>
   <div class="msgs" id="msgs">
     ${c.from?`<div class="origin"><small>Bu itiraf üzerinden tanıştınız</small><q>“${esc(c.from)}”</q></div>`:`<div class="origin"><small>Profil üzerinden tanıştınız</small></div>`}
     ${c.msgs.map((m,i)=>{const lk=!m.me&&isLockedIdx(c,i);return msgHTML(m,lk)}).join("")}
     ${c.status==="wait"?`<div class="sys">${esc(u.n)} isteğini henüz görmedi</div>`:""}
     ${c.typing?`<div class="typing"><i></i><i></i><i></i></div>`:""}
     ${full?`<div class="wall"><h3>${hidden?`${esc(u.n)} sana ${hidden} yeni mesaj yazdı`:`Sohbetin burada duraklatıldı`}</h3><p>${hidden?"Okumak ve cevap vermek için":"Sohbete devam etmek için"} Premium'a geç. ${esc(u.n)} sana yazmaya devam edebilir, mesajları burada birikir.</p><button class="btn gold wide" id="wallGo">Premium ile devam et</button></div>`:""}
   </div>
   <div class="composer">${full?`<button class="btn line wide" id="wallGo2">${IC.lock} Mesaj yazmak için Premium gerekli</button>`:
    `<div class="box">${c.status==="open"?`<button class="tb" data-media="photo" aria-label="Fotoğraf veya video gönder">${IC.cam}${lockBadge()}</button><button class="tb" data-media="voice" aria-label="Ses kaydı gönder">${IC.mic}${lockBadge()}</button>`:""}<textarea id="mIn" rows="1" maxlength="500" placeholder="${c.status==="wait"?"Kabul edilince yazabilirsin":"Mesaj yaz"}" ${c.status==="wait"?"disabled":""}></textarea><button class="go" id="mGo" disabled>Gönder</button></div><div id="mWarn"></div>`}</div>`;
  const box=$("#msgs");box.scrollTop=box.scrollHeight;
  $("#cBack").onclick=closeChat;
  $("#chatIn").querySelectorAll("[data-media]").forEach(b=>b.onclick=()=>media(b.dataset.media,c));
  [$("#wallGo"),$("#wallGo2")].forEach(b=>b&&(b.onclick=()=>showPremium("mesaj")));
  const t=$("#mIn");if(!t)return;
  t.oninput=()=>{grow(t);$("#mGo").disabled=!t.value.trim();$("#mWarn").innerHTML=""};
  t.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#mGo").click()}};
  $("#mGo").onclick=()=>{const v=t.value.trim();if(!v)return;const bad=contactBlock(v);
    if(bad){$("#mWarn").innerHTML=`<p class="warn">Bu mesaj gönderilmedi: ${bad} paylaşılamaz. Sohbetler sitede kalır, böylece iki taraf da güvende olur.</p>`;return}
    c.msgs.push({me:true,t:v});drawChat();
    const ci=c;setTimeout(()=>{ci.typing=true;if(state.chats[openIdx]===ci)drawChat()},700);
    setTimeout(()=>{ci.typing=false;ci.msgs.push({me:false,t:replyFor(ci)});if(state.chats[openIdx]===ci)drawChat();else{ci.unread=true;render()}
      if(!state.premium&&ci.msgs.length>=FREE_LIMIT&&!ci.extra){ci.extra=true;setTimeout(()=>{ci.msgs.push({me:false,t:"Tamam söylüyorum, Kızılay'daki yerin adı şu, gelince beraber gideriz belki."});if(state.chats[openIdx]===ci)drawChat();else{ci.unread=true;render()}},3500)}},2300);
    setTimeout(()=>{const x=$("#mIn");x&&x.focus()},30)};
}

/* ============ MEDYA (Premium) ============ */
const lockBadge=()=>state.premium?"":`<span class="lk">${IC.lock}</span>`;
function waveHTML(seed){let h="";for(let i=0;i<26;i++){const v=6+((seed*31+i*17)%18);h+=`<i style="height:${v}px"></i>`}return h}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function msgHTML(m,lk){
  const cls=`m ${m.me?"me":"them"} ${lk?"locked":""}`;
  if(m.kind==="img")return `<div class="${cls} media"><img src="${m.src}" alt="Gönderilen fotoğraf"></div>`;
  if(m.kind==="vid")return `<div class="${cls} media"><video src="${m.src}" controls playsinline></video></div>`;
  if(m.kind==="voice")return `<div class="${cls}"><div class="voice"><span class="pl">${IC.play}</span><span class="wave">${waveHTML(m.dur)}</span><span style="font-size:12.5px;font-variant-numeric:tabular-nums">${fmt(m.dur)}</span></div></div>`;
  if(m.kind==="call")return `<div class="callmsg">${m.type==="video"?IC.video:IC.phone}${m.type==="video"?"Görüntülü arama":"Sesli arama"}, ${fmt(m.dur)}</div>`;
  return `<div class="${cls}">${esc(m.t)}</div>`;
}
let picker=null;
function media(kind,c){
  if(!state.premium){showPremium("medya");return}
  if(c.status!=="open"){toast("Önce isteğin kabul edilmeli");return}
  if(kind==="photo"){
    if(!picker){picker=document.createElement("input");picker.type="file";picker.accept="image/*,video/*";picker.hidden=true;document.body.appendChild(picker)}
    picker.onchange=()=>{const f=picker.files[0];if(!f)return;const url=URL.createObjectURL(f);c.msgs.push({me:true,kind:f.type.startsWith("video")?"vid":"img",src:url});picker.value="";drawChat();fakeReply(c,"Vay, güzelmiş 🙂")};
    picker.click();return}
  if(kind==="voice"){let sec=0;openSheet(`<div class="rec"><div class="big">${IC.mic}</div><div class="tm" id="recT">0:00</div><p class="muted" style="font-size:13px">Kaydediliyor. Prototipte mikrofon açılmaz, kayıt taklit edilir.</p>
      <div style="display:flex;gap:8px;width:100%"><button class="btn line" style="flex:1" id="recX">Vazgeç</button><button class="btn" style="flex:1" id="recS">Gönder</button></div></div>`);
    const iv=setInterval(()=>{sec++;const e=$("#recT");if(e)e.textContent=fmt(sec);else clearInterval(iv)},1000);
    $("#recX").onclick=()=>{clearInterval(iv);closeSheet()};
    $("#recS").onclick=()=>{clearInterval(iv);closeSheet();c.msgs.push({me:true,kind:"voice",dur:Math.max(2,sec)});drawChat();fakeReply(c,"Sesin çok farklıymış, hayal ettiğim gibi değil haha")};return}
  if(kind==="call"||kind==="video")startCall(kind,c);
}
function fakeReply(c,t){setTimeout(()=>{c.typing=true;if(state.chats[openIdx]===c)drawChat()},800);setTimeout(()=>{c.typing=false;c.msgs.push({me:false,t});if(state.chats[openIdx]===c)drawChat()},2400)}
function startCall(type,c){
  const u=U[c.u];let el=$("#callscr");if(!el){el=document.createElement("div");el.id="callscr";el.className="callscr";el.setAttribute("role","dialog");document.body.appendChild(el)}
  let sec=0,live=false,mute=false,camOff=false,iv;
  const draw=()=>{el.style.background=type==="video"?`radial-gradient(circle at 50% 35%,${u.c}55,#14101A 70%),#14101A`:`linear-gradient(180deg,#2A2233,#14101A)`;
    el.innerHTML=`${type==="video"?`<div class="self">${camOff?"Kamera kapalı":"Kameran"}</div>`:""}
    <div style="display:flex;flex-direction:column;align-items:center">${av(c.u,120)}<h2>${esc(u.n)}</h2><div class="st">${live?fmt(sec):(type==="video"?"Görüntülü aranıyor…":"Aranıyor…")}</div></div>
    <div><div class="cbtns"><button class="cb" id="cMute" aria-pressed="${mute}" aria-label="Sessize al">${IC.mic}</button>${type==="video"?`<button class="cb" id="cCam" aria-pressed="${camOff}" aria-label="Kamerayı kapat">${IC.video}</button>`:""}<button class="cb end" id="cEnd" aria-label="Aramayı bitir">${IC.end}</button></div>
    <p class="cnote">Prototip: gerçek sürümde kamera ve mikrofon açılır.</p></div>`;
    $("#cMute").onclick=()=>{mute=!mute;draw()};const cc=$("#cCam");if(cc)cc.onclick=()=>{camOff=!camOff;draw()};
    $("#cEnd").onclick=()=>{clearInterval(iv);el.classList.remove("open");if(live){c.msgs.push({kind:"call",type,dur:sec});drawChat()}else toast("Arama iptal edildi")};};
  el.classList.add("open");draw();
  setTimeout(()=>{if(!el.classList.contains("open"))return;live=true;draw();iv=setInterval(()=>{sec++;const st=el.querySelector(".st");if(st)st.textContent=fmt(sec)},1000)},2500);
}
