<script src="{{APP_JS}}"></script>
<script type="module">
// Sunucu bağlantısı (Firebase, ~180 KB): oturumu olan hemen yükler; yeni gelen misafir için sayfa açıldıktan sonra
// (ilk dokunuşta ya da 5 saniye sonra) yüklenir, böylece ilk açılış hızlanır.
if(REMOTE){const y=window.__kdbYukle=()=>{if(!window.__kdbYuklendi){window.__kdbYuklendi=1;import("{{DB_JS}}")}};
  let o=false;try{o=Object.keys(localStorage).some(k=>k.startsWith("firebase:authUser"))||/[?&](oobCode|apiKey|emu)\b/.test(location.search)}catch(e){o=true}
  const bekle=()=>{["pointerdown","keydown"].forEach(t=>addEventListener(t,y,{once:true,capture:true}));setTimeout(y,5000)};
  if(o)y();else if(indexedDB.databases)indexedDB.databases().then(l=>l.some(d=>d.name==="firebaseLocalStorageDb")?y():bekle()).catch(y);else y()}
</script>
