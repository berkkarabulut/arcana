<style>
/* Layout: tek kolon gece akışı. İtiraflar el yazısı not gibi serif italik; geri kalan her şey sessiz sans. */
:root{
  /* KOYU MOD: Gece Yarısı ve Şeftali */
  --murekkep:#0B1220;--zemin-rgb:11,18,32;--sheet:#0F1729;--yuzey:#131D33;--yuzey2:#1C2945;
  --nar:#FF8A65;--nar-rgb:255,138,101;--nar-hi:#FF9877;--nar-lo:#EB7F5D;--nar-soft:#F7B9AA;--on-nar:#2A0F05;
  --altin:#7CC4FF;--altin-rgb:124,196,255;--altin-hi:#90CDFF;--altin-lo:#75B8F0;--on-altin:#06213A;
  --kagit:#EEF3FF;--kagit-rgb:238,243,255;--soluk:#94A3C0;--cizgi:rgba(238,243,255,.09);
  color-scheme:dark;
  --display:"Newsreader",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
/* AÇIK MOD: Açık Nane */
:root[data-theme="light"]{
  --murekkep:#F1F7F5;--zemin-rgb:241,247,245;--sheet:#FFFFFF;--yuzey:#FFFFFF;--yuzey2:#E3EFEB;
  --nar:#0F9D7A;--nar-rgb:15,157,122;--nar-hi:#2CA98A;--nar-lo:#0E9070;--nar-soft:#0F644F;--on-nar:#FFFFFF;
  --altin:#FF7A59;--altin-rgb:255,122,89;--altin-hi:#FF8E72;--altin-lo:#F07354;--on-altin:#FFFFFF;
  --kagit:#0F1F1B;--kagit-rgb:15,31,27;--soluk:#5C716B;--cizgi:rgba(15,31,27,.10);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--murekkep);color:var(--kagit);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--nar);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance}
.glyph{font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",var(--body);font-variant-emoji:text}
.muted{color:var(--soluk)}
.shell{max-width:480px;margin:0 auto;padding:0 16px 120px;min-height:100%}

/* üst */
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;padding:16px 0 10px;background:linear-gradient(var(--murekkep) 70%,transparent)}
.logo{font-family:var(--display);font-style:italic;font-size:30px;line-height:1;letter-spacing:-.02em}
.logo b{font-weight:400;color:var(--nar)}
.prem-pill{height:32px;padding:0 12px;border-radius:99px;border:1px solid rgba(var(--altin-rgb),.4);color:var(--altin);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}

/* avatar */
.av{flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#14101A;position:relative}
.av .z{position:absolute;right:-3px;bottom:-3px;width:46%;height:46%;border-radius:50%;background:var(--murekkep);color:var(--kagit);display:grid;place-items:center;font-size:.62em;border:1.5px solid var(--murekkep)}
.who{display:flex;align-items:center;gap:10px;text-align:left}
.who b{font-weight:700;font-size:14px}
.who small{display:block;color:var(--soluk);font-size:12.5px;line-height:1.3}

/* kategori */
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px 12px}
.cats::-webkit-scrollbar{display:none}
.c{flex:0 0 auto;height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--cizgi);font-size:13.5px;font-weight:600;color:var(--soluk);display:inline-flex;align-items:center;gap:6px}
.c[aria-pressed="true"]{background:var(--kagit);color:var(--murekkep);border-color:var(--kagit)}
.c.lock{opacity:.75}

/* itiraf kartı */
.it{background:var(--yuzey);border-radius:22px;padding:16px 16px 10px;margin-bottom:10px}
.it-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.it-cat{font-size:12px;color:var(--soluk);font-weight:600;white-space:nowrap}
.it blockquote{font-family:var(--display);font-style:italic;font-size:21px;line-height:1.38;margin:14px 2px 12px;letter-spacing:-.005em;cursor:pointer}
.it blockquote.long{font-size:18.5px}
.reacts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.r{height:32px;padding:0 11px;border-radius:99px;background:var(--yuzey2);font-size:13px;font-weight:600;color:var(--soluk);display:inline-flex;align-items:center;gap:6px}
.r[aria-pressed="true"]{background:rgba(var(--nar-rgb),.16);color:var(--kagit);box-shadow:inset 0 0 0 1px rgba(var(--nar-rgb),.5)}
.r .n{font-variant-numeric:tabular-nums}
.it-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;border-top:1px solid var(--cizgi);padding-top:6px}
.lnk{height:36px;padding:0 8px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--soluk);display:inline-flex;align-items:center;gap:7px}
.lnk:hover{color:var(--kagit);background:var(--cizgi)}
.lnk.dm{color:var(--nar)}
.lnk svg{width:17px;height:17px}

/* yorumlar */
.cm{padding:12px 0;border-top:1px solid var(--cizgi)}
.cm p{margin:6px 0 0 46px;font-size:15px;line-height:1.5}
.cm .who{width:100%}
.cm .when{margin-left:auto;font-size:12px;color:var(--soluk)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(var(--zemin-rgb),.7);display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--murekkep);border-radius:26px 26px 0 0;border:1px solid var(--cizgi);border-bottom:0;padding:10px 18px 24px;animation:up .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--cizgi);margin:0 auto 14px}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:28px;line-height:1.1}

/* yazma */
.box{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:18px;padding:4px;display:flex;align-items:flex-end;gap:4px}
.box textarea{flex:1;background:none;border:0;color:var(--kagit);font:inherit;font-size:15px;padding:11px 12px;resize:none;outline:none;min-height:44px;max-height:150px}
.box textarea::placeholder{color:var(--soluk)}
.box.big textarea{font-family:var(--display);font-style:italic;font-size:21px;line-height:1.4;min-height:150px}
.go{flex:0 0 auto;height:40px;padding:0 16px;border-radius:14px;background:var(--nar);color:var(--on-nar);font-weight:700;font-size:14px;margin:2px}
.go:disabled{opacity:.35;cursor:default}
.btn{height:48px;padding:0 20px;border-radius:15px;background:var(--nar);color:var(--on-nar);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.wide{width:100%}
.btn.line{background:none;border:1px solid var(--cizgi);color:var(--kagit)}
.btn.gold{background:var(--altin);color:var(--on-altin)}
.btn:disabled{opacity:.35;cursor:default}
.hint{font-size:12.5px;color:var(--soluk);margin-top:8px}
.warn{background:rgba(var(--nar-rgb),.12);color:var(--nar-soft);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:8px}

/* profil */
.pro-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 0 16px}
.pro-head h2{font-size:32px;margin-top:12px;line-height:1}
.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
.bd{height:30px;padding:0 11px;border-radius:99px;background:var(--yuzey2);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.bd .glyph{color:var(--nar)}
.bio{font-family:var(--display);font-style:italic;font-size:18px;line-height:1.4;color:var(--kagit);margin-top:14px;max-width:34ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--cizgi);border-bottom:1px solid var(--cizgi);margin:4px 0 14px}
.stats div{padding:12px 0;text-align:center}
.stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--soluk)}
.uyum{display:flex;align-items:center;gap:14px;background:var(--yuzey);border-radius:18px;padding:14px;margin-bottom:14px}
.ring{width:58px;height:58px;flex:0 0 auto}
.uyum b{font-size:15px}
.uyum p{font-size:13px;color:var(--soluk);line-height:1.4;margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--cizgi);margin-bottom:4px}
.tabs button{height:42px;padding:0 12px;font-weight:700;font-size:14px;color:var(--soluk);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--kagit);border-color:var(--nar)}
.mini{padding:12px 0;border-bottom:1px solid var(--cizgi)}
.mini q{font-family:var(--display);font-style:italic;font-size:17px;line-height:1.4;quotes:none;display:block}
.mini .on{font-size:12.5px;color:var(--soluk);margin-top:4px}
.pro-acts{display:flex;gap:8px;position:sticky;bottom:-24px;background:linear-gradient(transparent,var(--murekkep) 30%);padding:18px 0 4px;margin-top:8px}

/* mesajlar */
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--cizgi);width:100%;text-align:left}
.row .t{flex:1;min-width:0}
.row .t b{font-weight:700}
.row .t div{font-size:13.5px;color:var(--soluk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t div.blur{filter:blur(4px);user-select:none}
.row .meta{text-align:right;font-size:12px;color:var(--soluk)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--nar);margin-top:4px}
.h2s{font-family:var(--display);font-size:30px;margin:6px 0 8px}
.req{display:flex;gap:10px;align-items:center;background:var(--yuzey);border-radius:18px;padding:12px;margin-bottom:8px}
.req .t{flex:1;min-width:0}
.req .t q{font-family:var(--display);font-style:italic;font-size:14.5px;color:var(--soluk);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;quotes:none}
.sbtn{height:34px;padding:0 12px;border-radius:11px;font-size:13px;font-weight:700}
.sbtn.ok{background:var(--nar);color:var(--on-nar)}
.sbtn.no{border:1px solid var(--cizgi);color:var(--soluk)}

/* sohbet ekranı */
.chat{position:fixed;inset:0;z-index:45;background:var(--murekkep);display:none;flex-direction:column}
.chat.open{display:flex}
.chat-in{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%}
.chat-h{display:flex;align-items:center;gap:10px;padding:12px 12px;border-bottom:1px solid var(--cizgi)}
.back{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.back:hover{background:var(--cizgi)}
.chat-h .who{flex:1}
.meter{font-size:12px;color:var(--soluk);text-align:right;line-height:1.25}
.meter b{color:var(--kagit);font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--cizgi);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--nar);transition:width .3s}
.msgs{flex:1;overflow:auto;padding:14px 14px 10px;display:flex;flex-direction:column;gap:6px}
.origin{align-self:center;max-width:88%;text-align:center;margin:4px 0 12px}
.origin small{font-size:12px;color:var(--soluk)}
.origin q{display:block;font-family:var(--display);font-style:italic;font-size:16px;line-height:1.4;margin-top:4px;quotes:none}
.m{max-width:78%;padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.4;word-wrap:break-word}
.m.me{align-self:flex-end;background:var(--nar);color:var(--on-nar);border-bottom-right-radius:6px}
.m.them{align-self:flex-start;background:var(--yuzey2);border-bottom-left-radius:6px}
.m.locked{filter:blur(5px);user-select:none;pointer-events:none}
.sys{align-self:center;font-size:12.5px;color:var(--soluk);margin:6px 0}
.wall{margin:8px 0 4px;align-self:stretch;background:linear-gradient(160deg,var(--yuzey2),var(--yuzey));border:1px solid rgba(var(--altin-rgb),.35);border-radius:20px;padding:16px;text-align:center}
.wall h3{font-size:22px;line-height:1.2;margin-bottom:6px}
.wall p{font-size:13.5px;color:var(--soluk);margin-bottom:12px}
.composer{padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--cizgi)}
.hb,.tb{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--soluk);flex:0 0 auto}
.hb:hover,.tb:hover{background:var(--cizgi);color:var(--kagit)}
.hb svg,.tb svg{width:21px;height:21px}
.tb{width:38px;height:40px;margin:2px 0}
.lk{position:absolute;right:3px;bottom:4px;width:15px;height:15px;border-radius:50%;background:var(--altin);color:var(--on-altin);display:grid;place-items:center}
.lk svg{width:9px;height:9px}
.m.media{padding:4px;background:none}
.m.media img,.m.media video{display:block;max-width:230px;max-height:300px;border-radius:15px}
.voice{display:flex;align-items:center;gap:10px;min-width:180px}
.voice .pl{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:0 0 auto}
.wave{display:flex;align-items:center;gap:2px;flex:1;height:24px}
.wave i{width:3px;border-radius:2px;background:currentColor;opacity:.7}
.callmsg{align-self:center;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--soluk);background:var(--yuzey);padding:7px 12px;border-radius:99px;margin:4px 0}
.callmsg svg{width:15px;height:15px}
.rec{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 6px}
.rec .big{width:84px;height:84px;border-radius:50%;background:var(--nar);display:grid;place-items:center;color:var(--on-nar);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(var(--nar-rgb),.5)}100%{box-shadow:0 0 0 22px rgba(var(--nar-rgb),0)}}
.rec .tm{font-size:28px;font-variant-numeric:tabular-nums;font-weight:700}
.callscr{position:fixed;inset:0;z-index:58;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:60px 20px calc(36px + env(safe-area-inset-bottom));color:#fff;text-align:center}
.callscr.open{display:flex}
.callscr h2{font-size:34px;margin-top:18px}
.callscr .st{font-size:15px;opacity:.8;margin-top:6px;font-variant-numeric:tabular-nums}
.callscr .self{position:absolute;right:18px;top:18px;width:96px;height:132px;border-radius:16px;background:#2A2233;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;font-size:12px;color:var(--soluk)}
.cbtns{display:flex;gap:22px}
.cb{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
.cb[aria-pressed="true"]{background:#fff;color:#14101A}
.cb.end{background:#E5484D}
.cb svg{width:26px;height:26px}
.cnote{font-size:12px;opacity:.6;margin-top:14px}
.typing{display:inline-flex;gap:4px;padding:12px 14px;background:var(--yuzey2);border-radius:18px;align-self:flex-start}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--soluk);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}

/* premium */
.plans{display:grid;gap:8px;margin:14px 0}
.plan{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:16px;border:1px solid var(--cizgi);text-align:left;width:100%}
.plan[aria-pressed="true"]{border-color:var(--altin);background:rgba(var(--altin-rgb),.08)}
.plan b{font-size:15px}.plan small{display:block;font-size:12.5px;color:var(--soluk)}
.plan .p{font-weight:800;font-variant-numeric:tabular-nums}
.perks{display:grid;gap:8px;margin-top:12px}
.perks div{display:flex;gap:10px;font-size:14.5px}
.perks svg{flex:0 0 auto;color:var(--altin);margin-top:2px}

/* alt menü */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.nav-in{pointer-events:auto;width:100%;max-width:460px;height:66px;border-radius:22px;background:color-mix(in srgb,var(--yuzey) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--cizgi);display:grid;grid-template-columns:1fr 1fr 96px 1fr 1fr;align-items:center}
.nb{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--soluk);position:relative}
.nb svg{width:22px;height:22px}
.nb[aria-current="page"]{color:var(--kagit)}
.nb .pip{position:absolute;top:7px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--nar);color:var(--on-nar);font-size:10.5px;display:grid;place-items:center}
.confess{height:50px;margin:0 4px;border-radius:16px;background:var(--nar);color:var(--on-nar);font-weight:800;font-size:14px;line-height:1.1;box-shadow:0 8px 22px rgba(var(--nar-rgb),.35)}

.toast{position:fixed;left:50%;bottom:96px;z-index:100;pointer-events:none;transform:translate(-50%,12px);opacity:0;transition:.25s;background:var(--kagit);color:var(--murekkep);padding:11px 16px;border-radius:14px;font-size:13.5px;font-weight:700;max-width:88%;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{color:var(--soluk);padding:20px 4px;font-size:14px;line-height:1.55}

/* kayıt */
.onb{position:fixed;inset:0;z-index:60;background:var(--murekkep);overflow:auto}
.onb-in{max-width:480px;margin:0 auto;min-height:100%;padding:18px 22px 26px;display:flex;flex-direction:column}
.steps{display:flex;gap:6px;margin:6px 0 30px}
.steps i{flex:1;height:3px;border-radius:3px;background:var(--cizgi)}
.steps i.on{background:var(--nar)}
.ob-back{height:34px;color:var(--soluk);font-size:14px;display:inline-flex;align-items:center;gap:4px;margin-left:-4px;visibility:hidden}
.ob-back.show{visibility:visible}
.step{flex:1}
.step h1{font-size:40px;line-height:1.04;letter-spacing:-.015em;margin-bottom:12px}
.step .lead{color:var(--soluk);font-size:15.5px;max-width:36ch}
.nick{display:flex;align-items:center;gap:10px;margin-top:26px;border-bottom:1px solid var(--cizgi);padding-bottom:6px}
.nick input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--kagit);font-family:var(--display);font-style:italic;font-size:32px}
.nick input::placeholder{color:color-mix(in srgb,var(--soluk) 60%,transparent)}
.dice{height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--cizgi);font-size:13px;font-weight:700;color:var(--soluk);display:inline-flex;align-items:center;gap:6px;flex:0 0 auto}
.swatches{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid transparent}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--murekkep),0 0 0 4px var(--kagit)}
.wheels{position:relative;display:grid;gap:8px;margin-top:28px;height:220px}
.wheels::before{content:"";position:absolute;left:0;right:0;top:90px;height:40px;border-radius:10px;background:var(--yuzey);pointer-events:none}
.wheel{position:relative;height:220px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);overscroll-behavior:contain}
.wheel::-webkit-scrollbar{display:none}
.wheel .pad{height:90px}
.wheel button{display:block;width:100%;height:40px;scroll-snap-align:center;font-size:19px;color:var(--soluk);font-variant-numeric:tabular-nums}
.wheel button.sel{color:var(--kagit);font-weight:700}
.wlab{display:grid;gap:8px;text-align:center;font-size:12px;color:var(--soluk);margin-top:8px}
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.choice button{height:46px;border-radius:14px;border:1px solid var(--cizgi);font-weight:700;font-size:14px;color:var(--soluk)}
.choice button[aria-pressed="true"]{border-color:var(--nar);color:var(--kagit);background:rgba(var(--nar-rgb),.1)}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--soluk);margin-top:22px}
.sign-big{display:flex;align-items:center;gap:14px;margin-top:22px;background:var(--yuzey);border-radius:18px;padding:14px}
.sign-big .g{width:54px;height:54px;border-radius:16px;background:var(--yuzey2);display:grid;place-items:center;font-size:28px;color:var(--nar)}
.rules{display:grid;gap:10px;margin-top:22px}
.rules div{display:flex;gap:12px;font-size:14.5px;line-height:1.45}
.rules svg{flex:0 0 auto;margin-top:2px;color:var(--nar)}
.check{display:flex;gap:12px;align-items:flex-start;text-align:left;margin-top:22px;padding:14px;border:1px solid var(--cizgi);border-radius:16px;width:100%}
.check .bx{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--soluk);flex:0 0 auto;display:grid;place-items:center;margin-top:1px}
.check[aria-checked="true"] .bx{background:var(--nar);border-color:var(--nar)}
.ob-foot{padding-top:22px}
.city-search{display:block;width:100%;height:50px;border-radius:14px;border:1px solid var(--cizgi);background:var(--yuzey);color:var(--kagit);padding:0 14px;font:inherit;font-size:16px;outline:none}
.city-search:focus{border-color:var(--nar)}
span.city-search{display:grid}

/* ===== v6 rötuş katmanı ===== */
.skip{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 10px 0 16px;border-radius:12px;font-size:13.5px;font-weight:800;letter-spacing:.04em;color:var(--kagit);border:1px solid rgba(var(--kagit-rgb),.16)}
.skip:hover{color:var(--kagit);background:var(--yuzey)}

.brand-wrap{display:flex;flex-direction:column;line-height:1}
.tagline{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--soluk);margin-top:3px;padding-left:2px}

.pro-wrap .pro2 .ring2,.pro-wrap .ring2.ring2{background:var(--acc);padding:4px;box-shadow:0 0 0 4px var(--murekkep),0 0 24px color-mix(in srgb,var(--acc) 45%,transparent)}
.sheet .pro-wrap .pro2 .ring2{box-shadow:0 0 0 4px var(--sheet),0 0 24px color-mix(in srgb,var(--acc) 45%,transparent)}
.pro-wrap .bd .glyph{color:var(--acc)}
.pro-wrap .stats b{color:var(--acc)}
.pro-wrap .tabs button[aria-pressed="true"]{border-color:var(--acc)}
.pro-wrap .mini{border-left:2px solid color-mix(in srgb,var(--acc) 70%,transparent);padding-left:12px;border-bottom:0;margin:6px 0}
.pro-wrap .pro-acts .btn:not(.line){background:var(--acc);color:#14101A;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 35%,transparent)}
.pro-wrap .uyum{border-color:color-mix(in srgb,var(--acc) 35%,var(--cizgi))}
.pro-wrap .btn.line#editPro{border-color:color-mix(in srgb,var(--acc) 55%,transparent)}

.pb{width:15px;height:15px;display:inline-block;vertical-align:-2px;margin-left:5px;flex:0 0 auto;filter:drop-shadow(0 0 4px rgba(var(--altin-rgb),.35))}
h2 .pb{width:22px;height:22px;vertical-align:-1px;margin-left:8px}

.hs-wrap{position:relative}
.hs-btn{display:none}
@media (hover:hover) and (pointer:fine){
 .hs-wrap .cats,.hs-wrap .picker{cursor:grab}
 .hs-wrap .dragging{cursor:grabbing;scroll-behavior:auto}
 .hs-wrap .dragging *{pointer-events:none}
 .hs-btn{position:absolute;top:50%;transform:translateY(-58%);z-index:3;width:32px;height:32px;border-radius:50%;background:color-mix(in srgb,var(--yuzey2) 95%,transparent);border:1px solid rgba(var(--kagit-rgb),.16);color:var(--kagit);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .15s}
 .hs-btn.l{left:2px}.hs-btn.r{right:2px}
 .hs-wrap.can-l .hs-btn.l,.hs-wrap.can-r .hs-btn.r{opacity:1;pointer-events:auto}
 .hs-btn:hover{background:var(--yuzey2)}
}
.hs-wrap::before,.hs-wrap::after{content:"";position:absolute;top:0;bottom:8px;width:28px;z-index:2;pointer-events:none;opacity:0;transition:opacity .15s}
.hs-wrap::before{left:-14px;background:linear-gradient(90deg,var(--edge,var(--murekkep)),transparent)}
.hs-wrap::after{right:-14px;background:linear-gradient(270deg,var(--edge,var(--murekkep)),transparent)}
.hs-wrap.can-l::before,.hs-wrap.can-r::after{opacity:1}
.sheet .hs-wrap{--edge:var(--sheet)}

.pk-lock{position:absolute;right:5px;top:5px;width:18px;height:18px;border-radius:50%;background:var(--altin);color:var(--on-altin);display:grid;place-items:center;font-style:normal}
.pk.round .pk-lock{right:8px;top:4px}
.pk-lock svg{width:10px;height:10px}
.pnote{display:flex;gap:8px;align-items:flex-start;text-align:left;margin-top:12px;padding:10px 12px;border-radius:14px;background:rgba(var(--altin-rgb),.1);border:1px solid rgba(var(--altin-rgb),.3);color:#F3D9A8;font-size:12.5px;line-height:1.45;max-width:380px}
.pnote svg{flex:0 0 auto;width:15px;height:15px;margin-top:1px}

.cf.crop{max-width:440px}
.crop-frame{position:relative;width:100%;aspect-ratio:3/1;border-radius:16px;overflow:hidden;background:#000;touch-action:none;cursor:grab;user-select:none}
.crop-frame:active{cursor:grabbing}
.crop-frame.round{aspect-ratio:1/1;max-width:280px;margin:0 auto;border-radius:50%}
.crop-frame img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;pointer-events:none}
.crop-grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 33.2%,rgba(255,255,255,.22) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.22) 66.6%,transparent 66.8%),linear-gradient(180deg,transparent 33.2%,rgba(255,255,255,.22) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.22) 66.6%,transparent 66.8%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);border-radius:inherit}
.zoom-row{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--soluk)}
.zoom-row input{flex:1;accent-color:var(--nar);height:28px}

.cf-scrim{position:fixed;inset:0;z-index:80;background:rgba(var(--zemin-rgb),.72);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.cf{width:100%;max-width:400px;background:var(--sheet);border:1px solid var(--cizgi);border-radius:24px;padding:22px 20px 18px;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.cf h2{font-size:26px;line-height:1.1}
.cf-ic{width:44px;height:44px;border-radius:14px;background:rgba(var(--altin-rgb),.14);color:var(--altin);display:grid;place-items:center;margin-bottom:12px}
.cf-ic svg{width:20px;height:20px}
.cf-list{border:1px solid var(--cizgi);border-radius:16px;background:var(--yuzey)}
.cf-list div{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;font-size:14px}
.cf-list div+div{border-top:1px solid var(--cizgi)}
.cf-list span{color:var(--soluk)}
.cf-list b{font-weight:700;text-align:right;word-break:break-word}

.cover-edit{position:absolute;right:10px;top:10px;z-index:2;height:32px;padding:0 11px;border-radius:10px;background:rgba(var(--zemin-rgb),.55);backdrop-filter:blur(8px);color:#fff;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.cover-edit svg{width:15px;height:15px}
.ed-prev{position:relative;margin-bottom:46px}
.ed-cover{height:110px;border-radius:18px}
.ed-av{position:absolute;left:16px;bottom:-40px}
.ed-sec{margin-top:18px}
.ed-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ed-h b{font-size:14px}
.picker{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px}
.picker::-webkit-scrollbar{display:none}
.pk{flex:0 0 auto;width:64px;height:64px;border-radius:14px;overflow:hidden;position:relative;border:2px solid transparent;padding:0;background:var(--yuzey)}
.pk img{width:100%;height:100%;object-fit:cover;display:block}
.pk.wide-pk{width:118px}
.pk.wide-pk span{position:absolute;left:6px;bottom:5px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.pk.round{border-radius:50%}
.pk[aria-pressed="true"]{border-color:var(--nar);box-shadow:0 0 0 2px rgba(var(--nar-rgb),.25)}
.pk.up{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--soluk);border:1.5px dashed rgba(var(--kagit-rgb),.2);font-size:11px;font-weight:700}
.pk.up svg{width:20px;height:20px}
.ed-foot{position:sticky;bottom:-22px;background:var(--sheet);display:flex;gap:8px;padding:10px 0 4px;margin-top:6px}

body{font-size:14.5px}
.shell{padding:0 14px 120px}
button{transition:transform .12s ease,background-color .15s,color .15s,border-color .15s,box-shadow .15s}
button:active:not(:disabled){transform:scale(.97)}
.top{padding:14px 0 8px}
.logo{font-size:28px}
.top-r{display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--soluk);border:1px solid var(--cizgi);position:relative}
.icon-btn:hover{color:var(--kagit);background:var(--yuzey)}
.icon-btn svg{width:19px;height:19px}
.prem-pill{height:38px;border-radius:12px;padding:0 12px;font-size:12.5px;background:linear-gradient(135deg,rgba(var(--altin-rgb),.16),rgba(var(--altin-rgb),.04))}
/* segment + kategori */
.feed-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 10px}
.seg2{display:inline-flex;background:var(--yuzey);border-radius:12px;padding:3px;gap:2px}
.seg2 button{height:32px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--soluk)}
.seg2 button[aria-pressed="true"]{background:var(--yuzey2);color:var(--kagit);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.feed-count{font-size:12px;color:var(--soluk)}
.cats{margin:0 -14px;padding:2px 14px 12px;gap:6px}
.c{height:32px;padding:0 13px;font-size:13px;background:transparent}
.c:hover{color:var(--kagit);border-color:rgba(var(--kagit-rgb),.2)}
/* kart */
.it{background:linear-gradient(180deg,var(--yuzey),color-mix(in srgb,var(--yuzey) 85%,var(--murekkep)));border:1px solid var(--cizgi);border-radius:20px;padding:14px 14px 8px;margin-bottom:10px}
.it-top{align-items:center}
.who b{font-size:13.5px}
.who small{font-size:12px}
.it-cat{font-size:11.5px;font-weight:700;color:var(--soluk);background:var(--yuzey2);padding:4px 9px;border-radius:99px}
.it blockquote{font-family:var(--display);font-style:normal;font-size:17px;line-height:1.52;letter-spacing:0;margin:11px 2px 12px;color:var(--kagit)}
.it blockquote.long{font-size:16px}
.it-foot{border-top:1px solid var(--cizgi);margin-top:4px;padding-top:6px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.reacts{gap:5px;flex-wrap:nowrap}
.r{height:30px;padding:0 10px 0 8px;font-size:12.5px;gap:5px;background:transparent;border:1px solid var(--cizgi);color:var(--soluk)}
.r svg{width:15px;height:15px}
.r:hover{color:var(--kagit);border-color:rgba(var(--kagit-rgb),.18)}
.r[aria-pressed="true"]{background:rgba(var(--nar-rgb),.14);border-color:rgba(var(--nar-rgb),.55);color:var(--nar-soft);box-shadow:none}
.r[aria-pressed="true"] svg{color:var(--nar)}
.acts2{display:flex;align-items:center;gap:2px}
.ib{height:32px;min-width:32px;padding:0 8px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:5px;color:var(--soluk);font-size:12.5px;font-weight:700}
.ib:hover{background:var(--cizgi);color:var(--kagit)}
.ib svg{width:17px;height:17px}
.ib.dm{color:var(--nar)}
.mine-note{font-size:12px;color:var(--soluk)}
/* öne çıkan */
.feat{position:relative;border-radius:22px;padding:1px;background:linear-gradient(135deg,rgba(var(--nar-rgb),.7),rgba(var(--altin-rgb),.5) 60%,rgba(var(--nar-rgb),.15));margin-bottom:14px}
.feat .it{margin:0;border:0;border-radius:21px;background:linear-gradient(180deg,var(--yuzey2),var(--yuzey))}
.feat-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--altin);margin-bottom:2px}
.feat-tag svg{width:13px;height:13px}
/* avatar */
.av{overflow:visible}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av .z{font-size:.5em}
/* butonlar */
.btn{height:46px;border-radius:14px;font-size:14.5px;letter-spacing:.01em;background:linear-gradient(180deg,var(--nar-hi),var(--nar-lo));box-shadow:0 6px 18px rgba(var(--nar-rgb),.25),inset 0 1px 0 rgba(255,255,255,.15)}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn.line{background:transparent;box-shadow:none;border:1px solid rgba(var(--kagit-rgb),.14)}
.btn.line:hover{background:var(--yuzey)}
.btn.gold{background:linear-gradient(180deg,var(--altin-hi),var(--altin-lo));box-shadow:0 6px 18px rgba(var(--altin-rgb),.2),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.sm{height:38px;font-size:13.5px;padding:0 14px;border-radius:12px}
.go{background:linear-gradient(180deg,var(--nar-hi),var(--nar-lo));border-radius:12px}
.box{border-radius:16px;background:var(--yuzey)}
.box:focus-within{border-color:rgba(var(--nar-rgb),.55)}
/* alt menü */
.nav-in{height:64px;border-radius:20px;grid-template-columns:1fr 1fr 104px 1fr 1fr;background:color-mix(in srgb,var(--yuzey) 92%,transparent)}
.nb{font-size:10.5px;gap:4px}
.nb svg{width:21px;height:21px}
.confess{height:48px;border-radius:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px;background:linear-gradient(180deg,var(--nar-hi),var(--nar-lo));box-shadow:0 8px 22px rgba(var(--nar-rgb),.35),inset 0 1px 0 rgba(255,255,255,.18)}
.confess svg{width:17px;height:17px}
/* sheet */
.sheet{background:var(--sheet);padding:10px 16px 22px}
.sheet h2{font-size:24px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet-head h2{font-size:22px}
.x{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--soluk)}
.x:hover{background:var(--cizgi);color:var(--kagit)}
.menu{display:grid;gap:2px;margin-top:4px}
.menu button{display:flex;align-items:center;gap:12px;height:50px;padding:0 12px;border-radius:12px;font-size:15px;font-weight:600;text-align:left;width:100%}
.menu button:hover{background:var(--yuzey)}
.menu button svg{width:19px;height:19px;color:var(--soluk)}
.menu button.danger{color:var(--nar-soft)}
.menu button.danger svg{color:var(--nar-soft)}
/* yorumlar */
.cm{padding:12px 2px}
.cm p{margin:6px 0 0 44px;font-size:14.5px}
.composer2{position:sticky;bottom:-22px;background:var(--sheet);padding:10px 0 4px;margin-top:6px;display:flex;align-items:flex-end;gap:8px}
.composer2 .box{flex:1;min-width:0}
.box textarea{min-width:0}
.r{white-space:nowrap}
.it-foot{flex-wrap:nowrap}
.acts2{flex:0 0 auto}
/* profil */
.cover{height:118px;border-radius:22px;position:relative;overflow:hidden;margin-top:4px}
.cover::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 80% 0%,rgba(255,255,255,.18),transparent 55%),linear-gradient(180deg,transparent 40%,rgba(var(--zemin-rgb),.55))}
.pro2{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:-52px;position:relative;z-index:1}
.pro2 .ring2{padding:4px;border-radius:50%;background:var(--murekkep);line-height:0}
.pro-wrap .ring2 .av{box-shadow:0 0 0 3px var(--murekkep)}
.sheet .pro-wrap .ring2 .av{box-shadow:0 0 0 3px var(--sheet)}
.pro2 h2{font-family:var(--display);font-size:28px;margin-top:8px;line-height:1.1}
.cam{position:absolute;right:2px;bottom:4px;width:32px;height:32px;border-radius:50%;background:var(--kagit);color:var(--murekkep);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.cam svg{width:16px;height:16px}
.bio{font-family:var(--display);font-style:normal;font-size:16px;color:var(--kagit);margin-top:10px;max-width:36ch}
.bd{height:28px;font-size:12.5px;background:var(--yuzey);border:1px solid var(--cizgi)}
.stats{border:1px solid var(--cizgi);border-radius:16px;margin:16px 0 14px;background:var(--yuzey)}
.stats div+div{border-left:1px solid var(--cizgi)}
.stats b{font-size:18px}
.pro-btns{display:flex;gap:8px;margin-bottom:14px}
.pro-btns .btn{flex:1}
.private{border:1px dashed rgba(var(--kagit-rgb),.16);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.private summary{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:14px;list-style:none}
.private summary::-webkit-details-marker{display:none}
.private summary .chev{margin-left:auto;color:var(--soluk);transition:transform .2s}
.private[open] summary .chev{transform:rotate(180deg)}
.private p{font-size:13.5px;color:var(--soluk);margin-top:8px}
.private .val{color:var(--kagit);font-size:14.5px;line-height:1.6}
.mini q{font-family:var(--display);font-style:normal;font-size:15.5px}
.uyum{border:1px solid var(--cizgi)}
/* düzenle */
.edit-av{display:flex;align-items:center;gap:14px;margin:6px 0 16px}
.edit-av .acts3{display:flex;flex-wrap:wrap;gap:8px}
.swatches{gap:8px;margin-top:10px}
.sw{width:32px;height:32px}
.onb-photo{display:flex;align-items:center;gap:14px;margin-top:18px;padding:12px;border:1px dashed rgba(var(--kagit-rgb),.18);border-radius:16px;width:100%;text-align:left}
.onb-photo b{display:block;font-size:14.5px}
.onb-photo span.s{font-size:12.5px;color:var(--soluk)}
.row{border-radius:14px;padding:12px 8px}
.row:hover{background:var(--yuzey)}
.h2s{font-size:28px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== Eşleş ===== */
.ks-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ks-head .h2s{margin:6px 0}

.lk-stack{display:flex}.lk-stack .lk-av+.lk-av{margin-left:-12px}
.lk-av{display:inline-flex;border-radius:50%;border:2px solid var(--murekkep)}

.swc:focus-visible{outline:2px solid var(--altin);outline-offset:3px}
.swc-top{display:flex;align-items:center;gap:12px}
.swz{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:#fff;flex:none}

.swc-foot{display:flex;align-items:center;gap:12px;padding-top:14px;border-top:1px solid var(--cizgi)}
.swc-foot .ring{width:50px;height:50px;flex:none}
.swc-foot span{display:flex;flex-direction:column;line-height:1.3}.swc-foot b{font-size:14px}.swc-foot small{color:var(--soluk);font-size:12.5px}
.stamp{position:absolute;top:92px;padding:6px 14px;border-radius:10px;border:3px solid;font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase;pointer-events:none;z-index:2}

.stamp.no{right:22px;color:var(--soluk);transform:rotate(12deg);opacity:var(--no)}

.sw-acts{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:18px}
.swb{position:relative;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:var(--yuzey);border:1px solid rgba(var(--kagit-rgb),.12);transition:transform .15s}
.swb:active{transform:scale(.92)}
.swb.sm{width:48px;height:48px;color:var(--soluk)}
.swb.no{color:var(--kagit)}
.swb.yes{color:var(--on-nar);background:linear-gradient(180deg,var(--nar-hi),var(--nar-lo));border:0;box-shadow:0 8px 22px rgba(var(--nar-rgb),.35)}

.match-scrim{background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--nar) 22%,var(--murekkep)),var(--murekkep) 68%);backdrop-filter:blur(6px)}
.match{width:100%;max-width:380px;text-align:center;animation:up .35s cubic-bezier(.2,.8,.2,1)}
.m-avs{display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.m-a{display:inline-flex;border-radius:50%;padding:3px;background:var(--acc)}
.m-a .av{border:3px solid var(--murekkep)}
.m-a:first-child{transform:rotate(-8deg);margin-right:-14px}.m-a:last-child{transform:rotate(8deg);margin-left:-14px}
.m-h{position:relative;z-index:2;width:48px;height:48px;border-radius:50%;background:var(--nar);color:var(--on-nar);display:grid;place-items:center;box-shadow:0 0 0 4px var(--murekkep)}

/* ===== Ana ekrana ekle ===== */

.inst span{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}

.inst .btn{height:38px;padding:0 16px;flex:none}

.inst-steps{list-style:none;display:grid;gap:12px;padding:0}

/* ===== Hikâyede paylaş ===== */

a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn svg{width:18px;height:18px}
.mini-sh{display:inline-flex;align-items:center;gap:6px;margin-left:10px;font-size:12.5px;font-weight:700;color:var(--altin)}
.mini-sh svg{width:15px;height:15px}

/* paylaş butonu eklenince alt satır sığsın */
.it-foot .r{padding:0 8px 0 7px;gap:4px}
.it-foot .reacts{gap:4px}
.acts2 .ib{min-width:30px;padding:0 5px}
@media (max-width:390px){.it-foot{gap:3px}.it-foot .reacts{gap:3px}.it-foot .r{padding:0 6px 0 5px;gap:3px;font-size:12px}.it-foot .r svg{width:15px;height:15px}.acts2{gap:0}.acts2 .ib{padding:0 3px;min-width:27px;gap:3px}.acts2 .ib svg{width:16px;height:16px}}

/* ===== Karşılama ===== */
#onbIn.wel .steps,#onbIn.wel .ob-back{display:none}

.wel-hero{text-align:center;padding:12px 0 2px;position:relative}
.wel-hero::before{content:"";position:absolute;left:50%;top:-30px;width:420px;height:300px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(var(--nar-rgb),.22),transparent);pointer-events:none;z-index:-1}
.wel-logo{display:inline-flex;align-items:flex-end;gap:4px}
.wl{font-family:var(--display);font-style:italic;font-size:56px;line-height:.9;letter-spacing:-.01em}
.wd{width:12px;height:12px;border-radius:50%;background:var(--nar);margin-bottom:9px;box-shadow:0 0 16px rgba(var(--nar-rgb),.8)}

.wel-h2{font-family:var(--display);font-size:19px;line-height:1.3;margin:6px auto 0;max-width:320px;text-wrap:balance}
.wq-wrap{margin:18px -22px 0;display:grid;gap:10px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.wq-row{overflow:hidden}
.wq-track{display:flex;gap:10px;width:max-content;animation:wq 70s linear infinite}
.wq-row.r2 .wq-track{animation-duration:84s;animation-direction:reverse;padding-left:60px}
@keyframes wq{to{transform:translateX(-50%)}}
.wq{width:236px;flex:none;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--yuzey);border:1px solid var(--cizgi)}

.wel-steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 0}
.wel-steps li{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:10px 6px;border-radius:16px;background:rgba(var(--kagit-rgb),.03)}

/* ===== Bildirimler ===== */
.bell-pip{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--nar);color:var(--on-nar);font-size:10.5px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--murekkep)}

/* ===== Günlük burç ===== */

/* ===== Öne çıkar ===== */

/* ===== Yönetici paneli ===== */

.adm-in{max-width:640px;margin:0 auto;padding:18px 18px 60px}

const constCache={};
function constellationURI(sign){
  if(constCache[sign])return constCache[sign];
  const c=CONST[sign];if(!c)return "";
  const [pts,ed]=c,X=x=>(62+x*.92).toFixed(1),Y=y=>(6+y).toFixed(1);
  let seed=hsh(sign);const r=()=>{seed=(Math.imul(seed,1103515245)+12345)>>>0;return (seed%10000)/10000};
  let bg="";for(let i=0;i<34;i++)bg+=`<circle cx="${(r()*160).toFixed(1)}" cy="${(r()*60).toFixed(1)}" r="${(.25+r()*.45).toFixed(2)}" fill="#F4ECE4" opacity="${(.2+r()*.4).toFixed(2)}"/>`;
  const ln=ed.map(([a,b])=>`<line x1="${X(pts[a][0])}" y1="${Y(pts[a][1])}" x2="${X(pts[b][0])}" y2="${Y(pts[b][1])}"/>`).join("");
  const st=pts.map(([x,y],i)=>{const big=i%3===0;return `<circle cx="${X(x)}" cy="${Y(y)}" r="${big?3.4:2.6}" fill="#F4ECE4" opacity=".14"/><circle cx="${X(x)}" cy="${Y(y)}" r="${big?1.5:1.1}" fill="#F4ECE4"/>`}).join("");
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 60" preserveAspectRatio="xMaxYMid meet">${bg}<g stroke="#F4ECE4" stroke-opacity=".5" stroke-width=".5" stroke-linecap="round">${ln}</g>${st}</svg>`;
  return constCache[sign]="data:image/svg+xml,"+encodeURIComponent(svg);
}
function coverCSS(u){
  if(u.banner)return `background:#2A2233 url('${presetURI(u.banner)}') center/cover no-repeat`;
  const g=`radial-gradient(120% 160% at 100% 0%,color-mix(in srgb,${u.c||"#E8505B"} 45%,transparent),transparent 65%),linear-gradient(160deg,#1C2945,#0B1220 70%)`;
  const cu=u.s&&constellationURI(u.s);
  return cu?`background:url('${cu}') right 4% center/auto 92% no-repeat,${g}`:`background:${g}`;
}

// burç uyumu: element bazlı
// Burç uyumu: iki burç arasındaki açıya göre taban puan + her ikiliye özel sabit sapma (aynı ikili hep aynı puanı alır)
const SIGN_IDX=Object.fromEntries(SIGNS.map((x,i)=>[x.k,i]));
const ASPECT_BASE=[71,38,77,27,86,21,62];
function uyum(a,b){
  const ia=SIGN_IDX[a],ib=SIGN_IDX[b];if(ia==null||ib==null)return 50;
  let d=Math.abs(ia-ib);if(d>6)d=12-d;
  const key=ia<ib?a+b:b+a;let h=7;for(const ch of key)h=(h*31+ch.charCodeAt(0))%1009;
  return Math.max(11,Math.min(97,ASPECT_BASE[d]+(h%19)-9));
}
function uyumText(a,b,p){const ea=EL[Z[a].e],eb=EL[Z[b].e];
  if(a===b)return `İkiniz de ${Z[a].n}. Birbirinizi çok iyi anlarsınız ama aynı inatla da karşılaşırsınız.`;
  if(Z[a].e===Z[b].e)return `İkiniz de ${ea} grubundasınız. Aynı dili konuşursunuz, sohbet kendiliğinden akar.`;
  return p>=75?`${ea} ile ${eb} birbirini besler. Sohbetiniz hızlı ısınır.`:p>=50?`${ea} ile ${eb} farklı tempolarda gider. İlk mesajlar biraz yoklama olur, sonra açılır.`:`${ea} ile ${eb} pek aynı telden çalmaz. Zorlu ama sürprizli bir ikili, belki zıtlar birbirini çeker.`}
function ringSVG(p){const r=24,c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 58 58"><circle cx="29" cy="29" r="${r}" fill="none" stroke="var(--yuzey2)" stroke-width="5"/><circle cx="29" cy="29" r="${r}" fill="none" stroke="var(--acc,var(--nar))" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 29 29)"/><text x="29" y="30" text-anchor="middle" dominant-baseline="middle" fill="var(--kagit)" font-size="14" font-weight="800" font-family="Figtree">%${p}</text></svg>`}

// iletişim bilgisi filtresi
function contactBlock(t){
  const low=t.toLocaleLowerCase("tr");
  const digits=low.replace(/[^0-9]/g,"");
  if(/(\+?90|0)?\s*5\d{2}/.test(low.replace(/[\s.\-()]/g,""))&&digits.length>=9)return "telefon numarası";
  if(digits.length>=10)return "telefon numarası";
  const yazili=["sıfır","beş","bes","dokuz","sifir"];if(yazili.filter(w=>low.includes(w)).length>=3)return "yazıyla telefon numarası";
  const flat=low.replace(/[^a-zçğıöşü0-9]/g,"");
  const kw=[["instagram","Instagram"],["insta","Instagram"],["ınsta","Instagram"],["snapchat","Snapchat"],["snap","Snapchat"],["telegram","Telegram"],["whatsapp","WhatsApp"],["watsap","WhatsApp"],["vatsap","WhatsApp"],["wpden","WhatsApp"],["discord","Discord"],["tiktok","TikTok"],["twitter","X"],["gmail","e-posta"],["hotmail","e-posta"]];
  for(const[w,n]of kw)if(flat.includes(w))return n+" adresi";
  if(/@[a-z0-9_.]{3,}/i.test(t))return "kullanıcı adı";
  if(/\b[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}\b/i.test(t))return "e-posta";
  return null;
}

function dragCard(el,c){
  let x0=0,y0=0,dx=0,dy=0,on=false,id=null;
  const set=()=>{el.style.transform=`translate(${dx}px,${dy*.35}px) rotate(${dx/16}deg)`;el.style.setProperty("--yes",Math.max(0,Math.min(1,dx/110)));el.style.setProperty("--no",Math.max(0,Math.min(1,-dx/110)))};
  el.onpointerdown=e=>{if(sw.busy||e.button>0)return;on=true;id=e.pointerId;x0=e.clientX;y0=e.clientY;dx=dy=0;el.setPointerCapture(id);el.classList.add("drag")};
  el.onpointermove=e=>{if(!on)return;dx=e.clientX-x0;dy=e.clientY-y0;set()};
  const up=()=>{if(!on)return;on=false;el.classList.remove("drag");
    if(Math.abs(dx)>100)fling(el,c,dx>0,dx,dy);
    else{el.style.transform="";el.style.setProperty("--yes",0);el.style.setProperty("--no",0)}};
  el.onpointerup=up;el.onpointercancel=up;
}
function fling(el,c,like,dx=0,dy=0){

  const b=document.querySelector(".swc.under");if(b)b.classList.add("rise");

}

}

function wrapLines(ctx,text,maxW){
  const words=text.split(/\s+/),lines=[];let line="";
  for(const w of words){const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}
  if(line)lines.push(line);return lines;
}

/* ============ İÇERİK FİLTRESİ ============ */
const TR_NAMES=new Set("Mehmet Mustafa Ahmet Ali Hüseyin Hasan İbrahim İsmail Osman Yusuf Murat Ömer Ramazan Halil Süleyman Abdullah Mahmut Recep Emre Burak Kemal Fatih Serkan Hakan Kadir Orhan Can Cem Deniz Berk Arda Kerem Emir Eren Efe Mert Onur Tolga Volkan Uğur Okan Barış Batuhan Furkan Enes Yasin Oğuz Serdar Selim Tuncay Yiğit Kaan Alp Ege Baran Umut Sinan Erkan Gökhan Taner Cengiz Levent Erdem Engin Ercan Tarık Anıl Berkay Doğukan Görkem Halit Emirhan Metehan Alperen Ozan Tuna Koray Sercan Fatma Ayşe Emine Hatice Zeynep Elif Meryem Şerife Zehra Sultan Hanife Merve Esra Özlem Büşra Kübra Ebru Gizem Tuğba Ece Ceren Selin Cansu İrem Damla Buse Dilara Melis Ezgi Derya Seda Sibel Gamze Aslı Burcu Pınar Yasemin Gül Gülşen Nur Esma Beyza Sude Nisa Ecrin Defne Duru Eylül Azra Asya Ela Melike Sevgi Hande Tuba Nihan Nazlı Başak Didem Şeyma Rabia Hilal Aylin Berna Dilek Filiz Songül Yeliz Neslihan Gülay Hülya Serpil Sevda Şule Tuğçe Yağmur Begüm İpek Nehir Ada Lara".split(" "));
const NAME_OK_NEXT=new Set(["Bey","Hanım","Abi","Abla","Hoca","Hocam","Teyze","Amca","Dayı","Enişte","Yenge"]);
const DEFAULT_BANNED=["orospu","ibne","yarrak","yarak","amcık","sikiş","sikerim","sikeyim","pezevenk","kahpe","porno","nude","çıplak foto"];
function bannedList(){if(REMOTE&&typeof R!=="undefined"&&R.mod&&Array.isArray(R.mod.words))return R.mod.words;try{const l=JSON.parse(localStorage.getItem("arcana_banned")||"null");if(Array.isArray(l))return l}catch(e){}return DEFAULT_BANNED}
const lowTR=t=>t.toLocaleLowerCase("tr");
// sunucu kuralının kullandığı düzenli ifade: kelimenin başı eşleşir (istemci filtresiyle aynı mantık)
function bannedRegex(words){const ks=[...new Set(words.map(w=>lowTR(w).trim()).filter(Boolean))].map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));return ks.length?"(^|[^a-zçğıöşü0-9])("+ks.join("|")+")":""}
async function saveBanned(list){if(!REMOTE){LSset("arcana_banned",list);return}try{await KDB.setModeration(list,bannedRegex(list));toast("Kelime listesi herkese uygulandı")}catch(e){toast("Kaydedilemedi: "+(e.code||e.message))}}
// sunucunun reddettiği yazmalar için anlaşılır mesaj
function writeErr(e,kind){const c=e&&e.code||"";if(c==="permission-denied")return {itiraf:"İki itiraf arasında en az 15 dakika olmalı. Biraz sonra tekrar dene.",yorum:"Biraz yavaş: iki yorum arasında birkaç saniye beklemelisin.",mesaj:"Mesajın gitmedi. Biraz yavaş yaz ya da karşı taraf seni engellemiş olabilir.",istek:"İstek gönderilemedi. Yeni bir istek için biraz bekle ya da bu kişi seni engellemiş olabilir."}[kind]||"Bu işlem şu an yapılamadı.";return "Olmadı: "+(c||e&&e.message||"bilinmeyen hata")}
function bannedHit(t){
  const low=lowTR(t);
  for(const w of bannedList()){const k=lowTR(w).trim();if(!k)continue;
    const re=new RegExp("(^|[^a-zçğıöşü0-9])"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));if(re.test(low))return w}
  return null;
}
function nameHit(t){
  const words=t.split(/[\s,.;:!?()"“”'’…-]+/).filter(Boolean);
  for(let i=0;i<words.length-1;i++){const a=words[i],b=words[i+1];
    if(TR_NAMES.has(a)&&/^[A-ZÇĞİÖŞÜ][a-zçğıöşü]{2,}$/.test(b)&&!NAME_OK_NEXT.has(b)&&!TR_NAMES.has(b))return a+" "+b;
    if(TR_NAMES.has(a)&&TR_NAMES.has(b)&&i+2<words.length&&/^[A-ZÇĞİÖŞÜ][a-zçğıöşü]{2,}$/.test(words[i+2])&&!NAME_OK_NEXT.has(words[i+2]))return a+" "+b+" "+words[i+2];}
  return null;
}
const INST_RE=/(?:[A-ZÇĞİÖŞÜ][A-Za-zÇĞİÖŞÜçğıöşü]+\s+){1,4}(?:Lisesi|Koleji|Üniversitesi|Ortaokulu|İlkokulu|Okulları|Okulu|Hastanesi|Holding|Bankası|Belediyesi|Fakültesi|Yurdu|Dershanesi|Kursu|Şirketi|Mağazası|Market|Kafe|Cafe)(?![a-zçğıöşü])|\bA\.?Ş\.?(?=\s|$)/;
/* kind: "itiraf" | "yorum" | "mesaj". Uygunsa null, değilse kullanıcıya gösterilecek açıklama döner. */
function modCheck(t,kind){
  const w=bannedHit(t);
  if(w){track("filtre_kelime");return `“${esc(w)}” Kulis'te kullanılamıyor. Cinsel içerik ve hakaret içeren kelimeler engelleniyor.`}
  if(kind==="mesaj")return null;
  if(/(^|\s)@[A-Za-z0-9_.]{3,}/.test(t)){track("filtre_kullaniciadi");return "Başka birinin kullanıcı adını yazamazsın. Kimseyi etiketleme, ifşa etme."}
  const n=nameHit(t);
  if(n){track("filtre_isim");return `“${esc(n)}” gerçek bir ad soyad gibi görünüyor. ${kind==="itiraf"?"İtiraflarda":"Yorumlarda"} kimsenin adını soyadını yazamazsın, kimseyi ifşa etmeden anlat.`}
  const m=t.match(INST_RE);
  if(m){track("filtre_kurum");return `“${esc(m[0].trim())}” bir okul ya da iş yeri adı gibi görünüyor. Kimsenin tanınmasına yol açacak yer adı yazma.`}
  return null;
}

const LEGAL={"guncelleme": "22 Kasım 2026", "sorumlu": "Mehmet Berk KARABULUT", "docs": [{"id": "kosullar", "file": "kosullar.html", "title": "Kullanım Koşulları", "sections": [["Kulis nedir?", "Kulis, kullanıcıların takma adla itiraf paylaştığı, bu itiraflara tepki ve yorum bıraktığı, birbirleriyle eşleşip mesajlaştığı bir uygulamadır. Bu koşullar Kulis'i kullanan herkes için geçerlidir. Uygulamaya üye olarak ya da üye olmadan kullanarak bu koşulları kabul etmiş sayılırsın."], ["Kimler kullanabilir?", "Kulis'i yalnızca 18 yaşını doldurmuş kişiler kullanabilir. Kayıt sırasında doğum tarihini doğru girmekle yükümlüsün. 18 yaşından küçük olduğu anlaşılan hesaplar uyarı yapılmadan kapatılır."], ["Hesabın", "Hesabını başkasıyla paylaşamaz, başkası adına hesap açamazsın. Adın, soyadın ve e-postan diğer kullanıcılara gösterilmez; herkes seni seçtiğin takma adla görür. Takma adın başka bir kişiyi taklit edemez, hakaret ya da cinsel içerik barındıramaz. Hesabının güvenliğinden sen sorumlusun."], ["Paylaştığın içerik", "İtiraf, yorum ve mesajlarının sorumluluğu sana aittir. Paylaştığın içeriğin Kulis içinde gösterilmesi, öne çıkarılması ve hikâye görseli olarak paylaşılabilmesi için Kulis'e ücretsiz, münhasır olmayan bir kullanım izni vermiş olursun. İçeriğini sildiğinde bu izin sona erer; yasal saklama yükümlülükleri saklıdır."], ["Yasak olanlar", "Şunlar yasaktır: başka bir kişinin adını, soyadını, okulunu, iş yerini, fotoğrafını veya onu tanınır kılacak bilgileri paylaşmak; telefon numarası, sosyal medya hesabı gibi iletişim bilgisi paylaşmak; cinsel ya da müstehcen içerik; taciz, tehdit, zorbalık, nefret söylemi; dolandırıcılık, spam ve reklam; 18 yaşından küçüklere ilişkin her türlü uygunsuz içerik; suç teşkil eden ya da suça teşvik eden içerik; Kulis'in işleyişini bozmaya yönelik girişimler. Ayrıntılar Topluluk Kuralları'nda yer alır."], ["Denetim ve yaptırımlar", "Kulis, kurallara aykırı içerikleri otomatik filtreler, kullanıcı şikâyetleri ve yönetici incelemesiyle tespit eder. Aykırı içerik önceden haber verilmeksizin kaldırılabilir; ihlalin ağırlığına göre uyarı verilebilir, hesap geçici olarak kısıtlanabilir ya da kalıcı olarak kapatılabilir. Şikâyetler en geç 24 saat içinde incelenir. Kanunen gerekli hallerde bilgiler yetkili mercilerle paylaşılır."], ["Premium ve ödemeler", "Bazı özellikler ücretli Premium üyelikle sunulur. Ödemeler yalnızca App Store veya Google Play üzerinden alınır; Kulis kart bilgisi istemez ve saklamaz. Abonelik, iptal edilmedikçe dönem sonunda mağaza tarafından yenilenir. İptal ve iade talepleri ilgili mağazanın kurallarına tabidir. Kurallara aykırılık nedeniyle kapatılan hesaplar için kalan süre iadesi yapılmaz."], ["Eşleşme ve mesajlaşma", "Eşleşme özelliği, iki kullanıcının birbirinin itirafını beğenmesi halinde sohbet başlatır. Tanıştığın kişilerle ilgili kararların sorumluluğu sana aittir. Kişisel bilgilerini paylaşırken ve yüz yüze görüşme kararı verirken dikkatli ol. Rahatsız olduğunda kullanıcıyı engelleyebilir ve şikâyet edebilirsin."], ["Sorumluluğun sınırı", "Kulis, kullanıcıların paylaştığı içeriklerin doğruluğunu garanti etmez ve bunları önceden denetleme yükümlülüğü taşımaz; 5651 sayılı Kanun kapsamında yer sağlayıcı olarak hukuka aykırı içerikten haberdar edildiğinde gerekli işlemi yapar. Günlük burç yorumları eğlence amaçlıdır ve tavsiye niteliği taşımaz. Uygulamanın kesintisiz ya da hatasız çalışacağı garanti edilmez."], ["Hesabını kapatma", "Hesabını istediğin zaman kapatabilirsin. Hesabın kapandığında itirafların, yorumların ve mesajların silinir; yasal zorunluluk nedeniyle saklanması gereken kayıtlar ilgili süre boyunca saklanır ve sonra silinir."], ["Değişiklikler", "Bu koşullar güncellenebilir. Önemli değişiklikler uygulama içinde duyurulur. Değişiklikten sonra Kulis'i kullanmaya devam etmen güncel koşulları kabul ettiğin anlamına gelir."], ["Uygulanacak hukuk", "Bu koşullar Türkiye Cumhuriyeti hukukuna tabidir. Uyuşmazlıklarda tüketici işlemleri bakımından Tüketici Hakem Heyetleri ve Tüketici Mahkemeleri, diğer hallerde Ankara Mahkemeleri ve İcra Daireleri yetkilidir."]]}, {"id": "kvkk", "file": "gizlilik.html", "title": "KVKK Aydınlatma Metni ve Gizlilik Politikası", "sections": [["Veri sorumlusu", "6698 sayılı Kişisel Verilerin Korunması Kanunu (KVKK) kapsamında veri sorumlusu Mehmet Berk KARABULUT'tur (bundan sonra “Kulis”). Bu metin, Kulis'i kullanırken hangi kişisel verilerinin, hangi amaçlarla ve nasıl işlendiğini açıklar."], ["İşlenen veriler", "Kimlik ve iletişim: ad, soyad, e-posta adresi (Google, Apple veya e-posta ile üyelikte). Profil: takma ad, doğum tarihi (yalnızca burç ve yaş aralığı gösterilir), cinsiyet, profil rengi, isteğe bağlı profil ve kapak görseli, kısa tanıtım yazısı. Kullanıcı içeriği: itiraflar, yorumlar, tepkiler, mesajlar, gönderilen fotoğraf, ses ve videolar, eşleşme tercihlerin. İşlem güvenliği: giriş kayıtları, IP adresi, cihaz ve tarayıcı bilgisi, şikâyet ve engelleme kayıtları. Ödeme: Premium satın alımlarında yalnızca mağazanın ilettiği abonelik durumu; kart bilgisi Kulis'e ulaşmaz."], ["Hangi amaçlarla?", "Üyeliğini oluşturmak ve yönetmek; itiraf, yorum, eşleşme ve mesajlaşma hizmetlerini sunmak; 18 yaş sınırını uygulamak; kurallara aykırı içerikleri tespit etmek ve şikâyetleri incelemek; hesap ve platform güvenliğini sağlamak; Premium üyeliği yönetmek; hizmeti geliştirmek için toplu ve kimliği belirsiz istatistikler çıkarmak; yasal yükümlülükleri yerine getirmek ve yetkili mercilerin taleplerini karşılamak."], ["Hukuki sebepler", "Verilerin KVKK'nın 5. maddesindeki şu sebeplere dayanılarak işlenir: sözleşmenin kurulması ve ifası (üyelik ve hizmetin sunulması), veri sorumlusunun hukuki yükümlülüğü (5651 sayılı Kanun kapsamındaki kayıtlar, yetkili merci talepleri), meşru menfaat (güvenlik, dolandırıcılık ve kötüye kullanımın önlenmesi, hizmetin geliştirilmesi) ve gerektiğinde açık rızan. Cinsel hayata veya sağlığa ilişkin bilgiler gibi özel nitelikli kişisel verilerini itiraflarına yazmaman önerilir; yazman halinde bu bilgiler senin tarafından alenileştirilmiş sayılır ve yalnızca hizmetin sunulması için işlenir."], ["Kimlerle paylaşılır?", "Takma adın, burcun, yaş aralığın, cinsiyetin ve paylaştığın içerikler diğer kullanıcılara görünür. Adın, soyadın, e-postan ve doğum tarihin hiçbir kullanıcıya gösterilmez. Veriler hizmetin işletilmesi için barındırma, veritabanı, e-posta, içerik denetimi ve kimlik doğrulama hizmeti aldığımız tedarikçilerle; çerez onayı vermen halinde istatistik amacıyla Google Analytics ile; ödemeler için App Store ve Google Play ile; kanunen yetkili kamu kurum ve kuruluşlarıyla paylaşılabilir. Bu tedarikçilerin bir kısmının sunucuları yurt dışında bulunduğundan, verilerin KVKK'nın 9. maddesinde öngörülen güvenceler (standart sözleşme vb.) çerçevesinde yurt dışına aktarılabilir."], ["Ne kadar süre saklanır?", "Hesap verileri hesabın açık olduğu sürece saklanır. Hesabını kapattığında profilin, itirafların, yorumların ve mesajların silinir. 5651 sayılı Kanun ve ilgili mevzuat gereği tutulması zorunlu işlem kayıtları mevzuatta öngörülen süre boyunca saklanır. Şikâyet ve yaptırım kayıtları, kötüye kullanımın tekrarını önlemek amacıyla en fazla 2 yıl saklanır. Süresi dolan veriler silinir, yok edilir ya da anonim hale getirilir."], ["Çerezler ve istatistik", "Kulis reklam çerezi kullanmaz. Oturumunun açık kalması, ayarlarının ve taslaklarının hatırlanması için tarayıcının yerel depolama alanı kullanılır; bunlar zorunludur. Uygulamayı geliştirmek için, yalnızca çerez uyarısında “Kabul et” dersen Google Analytics kullanılır. Bu durumda hangi ekranları açtığın, ne kadar kaldığın, cihaz ve tarayıcı türün ile IP adresinden çıkarılan yaklaşık şehir bilgisi Google LLC'ye (ABD) iletilir; itirafların, mesajların, adın ve e-postan iletilmez. “Sadece gerekli” dersen Google Analytics hiç yüklenmez. Tercihini istediğin zaman Profilim'in altındaki “Çerez tercihleri” bağlantısından değiştirebilirsin. Yazı tipleri Google Fonts üzerinden yüklenir; bu sırada IP adresin Google'a iletilebilir."], ["Hakların", "KVKK'nın 11. maddesi uyarınca; verilerinin işlenip işlenmediğini öğrenme, işlenmişse bilgi talep etme, işlenme amacını ve amacına uygun kullanılıp kullanılmadığını öğrenme, aktarıldığı üçüncü kişileri bilme, eksik veya yanlış işlenmişse düzeltilmesini, silinmesini veya yok edilmesini isteme, bu işlemlerin aktarıldığı kişilere bildirilmesini isteme, otomatik sistemlerle analiz edilmesi sonucu aleyhine bir sonuç çıkmasına itiraz etme ve kanuna aykırı işleme nedeniyle zarara uğraman halinde zararın giderilmesini talep etme haklarına sahipsin."], ["Başvuru", "Haklarını kullanmak için aşağıdaki iletişim adresine yazabilirsin. Başvurun en geç 30 gün içinde ücretsiz olarak sonuçlandırılır. Başvurunun reddedilmesi veya cevabı yetersiz bulman halinde Kişisel Verileri Koruma Kurulu'na şikâyette bulunabilirsin."]]}, {"id": "kurallar", "file": "kurallar.html", "title": "Topluluk Kuralları", "sections": [["Kulis'in ruhu", "Burası içinden geçeni kimseyi incitmeden söyleyebildiğin bir yer. Herkes takma adla yazıyor, kimse yargılanmak için gelmiyor. Okuduğun itirafa nasıl yaklaşılmasını istersen sen de öyle yaklaş."], ["Kimseyi ifşa etme", "İtiraflarında, yorumlarında ve mesajlarında başkasının adını, soyadını, okulunu, iş yerini, adresini, kullanıcı adını ya da fotoğrafını paylaşma. “Bir arkadaşım”, “iş yerindeki biri” demen yeterli. Başkasını tanınır kılan içerikler kaldırılır."], ["İletişim bilgisi yok", "Telefon numarası, Instagram, Snapchat, WhatsApp, Telegram gibi hesaplar ve e-posta adresleri paylaşılamaz. Tanışmak istediğin biriyle Kulis içinden mesajlaş. Bu kural seni dolandırıcılara ve tacizcilere karşı korur."], ["Cinsel içerik yok", "Müstehcen yazı, fotoğraf, ses veya video paylaşmak yasaktır. Karşı tarafın istemediği cinsel içerikli mesajlar hesabın kalıcı olarak kapatılmasına neden olur."], ["Saygı", "Hakaret, tehdit, zorbalık, ırk, din, cinsiyet, cinsel yönelim, engellilik gibi özelliklere yönelik nefret söylemi yasaktır. Tartışabilirsin ama kişiye saldırma."], ["Güvenlik", "18 yaşından küçük olduğunu düşündüğün birini gördüğünde şikâyet et. Para, hediye kartı veya kişisel bilgi isteyen birini görürsen konuşmayı kes ve şikâyet et. Kendine veya başkasına zarar verme düşüncesi içeren bir itiraf görürsen şikâyet et; acil durumlarda 112'yi ara."], ["Şikâyet ve engelleme", "Rahatsız olduğun her içeriği ve kullanıcıyı tek dokunuşla şikâyet edebilir ya da engelleyebilirsin. Kimin şikâyet ettiği gösterilmez. Şikâyetler en geç 24 saat içinde incelenir."], ["Kurallar çiğnenirse", "İlk ihlalde içerik kaldırılır ve uyarı verilir. Tekrarlayan ya da ağır ihlallerde hesap geçici olarak kısıtlanır veya kalıcı olarak kapatılır. Kapatılan hesapla yeniden hesap açmak yasaktır."]]}]};

    ${d.sections.map(([h,t])=>`<h2>${h}</h2><p>${esc(t)}</p>`).join("")}

function openCropper(img,kind,onDone,onCancel){
  const isB=kind==="banner",OW=isB?900:320,OH=isB?300:320;
  const g=document.createElement("div");g.className="cf-scrim";g.setAttribute("role","dialog");g.setAttribute("aria-modal","true");
  g.innerHTML=`<div class="cf crop"><h2>${isB?"Kapağı ayarla":"Fotoğrafı ayarla"}</h2>
    <p class="muted" style="font-size:13.5px;margin:6px 0 14px">Sürükleyerek konumunu, alttaki çubukla yakınlığını ayarla.</p>
    <div class="crop-frame ${isB?"":"round"}" id="cfr"><img alt="" draggable="false"><div class="crop-grid"></div></div>
    <div class="zoom-row"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="M8 11h6M20 20l-4-4"/></svg>
      <input type="range" id="zm" min="1" max="3" step="0.01" value="1" aria-label="Yakınlaştır">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="M8 11h6M11 8v6M20 20l-4-4"/></svg></div>
    <div style="display:flex;gap:8px;margin-top:16px"><button class="btn line" style="flex:1" id="crN">Vazgeç</button><button class="btn" style="flex:2" id="crY">Uygula</button></div></div>`;
  document.body.appendChild(g);
  const fr=g.querySelector("#cfr"),im=fr.querySelector("img"),zm=g.querySelector("#zm");
  im.src=img.src;
  let FW,FH,s0,z=1,x=0,y=0;
  const layout=()=>{FW=fr.clientWidth;FH=fr.clientHeight;s0=Math.max(FW/img.width,FH/img.height)};
  const clamp=()=>{const dw=img.width*s0*z,dh=img.height*s0*z;x=Math.min(0,Math.max(FW-dw,x));y=Math.min(0,Math.max(FH-dh,y))};
  const paint=()=>{clamp();im.style.width=img.width*s0*z+"px";im.style.height=img.height*s0*z+"px";im.style.transform=`translate(${x}px,${y}px)`};
  layout();x=(FW-img.width*s0)/2;y=(FH-img.height*s0)/2;paint();
  const setZoom=(nz,cx=FW/2,cy=FH/2)=>{nz=Math.min(3,Math.max(1,nz));const k=nz/z;x=cx-(cx-x)*k;y=cy-(cy-y)*k;z=nz;zm.value=z;paint()};
  zm.oninput=()=>setZoom(+zm.value);
  let drag=null;const pts=new Map();let pinch=null;
  fr.addEventListener("pointerdown",e=>{fr.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1)drag={sx:e.clientX,sy:e.clientY,ox:x,oy:y};
    if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z};drag=null}});
  fr.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&pts.size===2){const [a,b]=[...pts.values()];const r=fr.getBoundingClientRect();setZoom(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);return}
    if(drag){x=drag.ox+(e.clientX-drag.sx);y=drag.oy+(e.clientY-drag.sy);paint()}});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size)drag=null};
  fr.addEventListener("pointerup",up);fr.addEventListener("pointercancel",up);
  fr.addEventListener("wheel",e=>{e.preventDefault();const r=fr.getBoundingClientRect();setZoom(z*(e.deltaY<0?1.08:1/1.08),e.clientX-r.left,e.clientY-r.top)},{passive:false});
  fr.tabIndex=0;fr.addEventListener("keydown",e=>{const st=10;if(e.key==="ArrowLeft")x+=st;else if(e.key==="ArrowRight")x-=st;else if(e.key==="ArrowUp")y+=st;else if(e.key==="ArrowDown")y-=st;else return;e.preventDefault();paint()});
  const close=()=>{g.remove();removeEventListener("resize",onRs)};
  const onRs=()=>{const cx=(FW/2-x)/(s0*z),cy=(FH/2-y)/(s0*z);layout();x=FW/2-cx*s0*z;y=FH/2-cy*s0*z;paint()};addEventListener("resize",onRs);
  g.querySelector("#crN").onclick=()=>{close();onCancel&&onCancel()};
  g.querySelector("#crY").onclick=()=>{const c=document.createElement("canvas");c.width=OW;c.height=OH;const r=OW/FW;
    c.getContext("2d").drawImage(img,x*r,y*r,img.width*s0*z*r,img.height*s0*z*r);close();onDone(c.toDataURL("image/jpeg",.85))};
}

const lockBadge=()=>state.premium?"":`<span class="lk">${IC.lock}</span>`;
function waveHTML(seed){let h="";for(let i=0;i<26;i++){const v=6+((seed*31+i*17)%18);h+=`<i style="height:${v}px"></i>`}return h}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function msgHTML(m,lk){
  const cls=`m ${m.me?"me":"them"} ${lk?"locked":""}`;
  if((m.kind==="img"||m.kind==="vid")&&!m.src)return `<div class="${cls}"><span style="opacity:.75">${m.kind==="vid"?"Video":"Fotoğraf"} gönderildi</span></div>`;
  if(m.kind==="img")return `<div class="${cls} media"><img src="${m.src}" alt="Gönderilen fotoğraf"></div>`;
  if(m.kind==="vid")return `<div class="${cls} media"><video src="${m.src}" controls playsinline></video></div>`;
  if(m.kind==="voice")return `<div class="${cls}"><div class="voice"><span class="pl">${IC.play}</span><span class="wave">${waveHTML(m.dur)}</span><span style="font-size:12.5px;font-variant-numeric:tabular-nums">${fmt(m.dur)}</span></div></div>`;
  if(m.kind==="call")return `<div class="callmsg">${m.type==="video"?IC.video:IC.phone}${m.type==="video"?"Görüntülü arama":"Sesli arama"}, ${fmt(m.dur)}</div>`;
  return `<div class="${cls}">${esc(m.t)}</div>`;
}
let picker=null;
function media(kind,c){
  if(!state.premium){showPremium("medya");return}
  if(c.status!=="open"){toast("Önce isteğin kabul edilmeli");return}
  if(kind==="photo"){
    if(!picker){picker=document.createElement("input");picker.type="file";picker.accept="image/*,video/*";picker.hidden=true;document.body.appendChild(picker)}
    picker.onchange=()=>{const f=picker.files[0];if(!f)return;const url=URL.createObjectURL(f);c.msgs.push({me:true,kind:f.type.startsWith("video")?"vid":"img",src:url});picker.value="";drawChat();fakeReply(c,"Vay, güzelmiş 🙂")};
    picker.click();return}
  if(kind==="voice"){let sec=0;openSheet(`<div class="rec"><div class="big">${IC.mic}</div><div class="tm" id="recT">0:00</div><p class="muted" style="font-size:13px">Kaydediliyor. Prototipte mikrofon açılmaz, kayıt taklit edilir.</p>
      <div style="display:flex;gap:8px;width:100%"><button class="btn line" style="flex:1" id="recX">Vazgeç</button><button class="btn" style="flex:1" id="recS">Gönder</button></div></div>`);
    const iv=setInterval(()=>{sec++;const e=$("#recT");if(e)e.textContent=fmt(sec);else clearInterval(iv)},1000);
    $("#recX").onclick=()=>{clearInterval(iv);closeSheet()};
    $("#recS").onclick=()=>{clearInterval(iv);closeSheet();c.msgs.push({me:true,kind:"voice",dur:Math.max(2,sec)});drawChat();fakeReply(c,"Sesin çok farklıymış, hayal ettiğim gibi değil haha")};return}
  if(kind==="call"||kind==="video")startCall(kind,c);
}
function fakeReply(c,t){setTimeout(()=>{c.typing=true;if(state.chats[openIdx]===c)drawChat()},800);setTimeout(()=>{c.typing=false;c.msgs.push({me:false,t});if(state.chats[openIdx]===c)drawChat()},2400)}
function startCall(type,c){

    const mv=ev=>{const dx=ev.clientX-sx;if(!moved&&Math.abs(dx)>5){moved=true;el.classList.add("dragging")}if(moved)el.scrollLeft=sl-dx};
